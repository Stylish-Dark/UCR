name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore pinned IOWrapper source
        shell: pwsh
        run: |
          if (-not (Test-Path "submodules\IOWrapper\IOWrapper.sln")) {
            New-Item -ItemType Directory -Force -Path "submodules" | Out-Null
            git clone https://github.com/evilC/IOWrapper.git "submodules\IOWrapper"
          }
          git -C "submodules\IOWrapper" fetch --all --tags --prune
          git -C "submodules\IOWrapper" checkout --force 4ef0a847fb479cfbe561656097639d3cef5240b7

      - name: Preserve IOWrapper input callback order
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-IOWrapperInputOrdering.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Harden Core Interception hotplug handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-CoreInterceptionHotplugSafety.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Enable Core Interception blocking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $PWD 'submodules\IOWrapper\Source\Core Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) {
            throw "Core Interception settings file is missing: $settings"
          }

          [xml]$xml = Get-Content -LiteralPath $settings -Raw
          $blockingSettings = @($xml.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($blockingSettings.Count -ne 1) {
            throw "Expected exactly one BlockingEnabled setting, found $($blockingSettings.Count)."
          }
          $blockingSettings[0].InnerText = 'true'
          $xml.Save($settings)

          [xml]$verified = Get-Content -LiteralPath $settings -Raw
          $verifiedSettings = @($verified.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($verifiedSettings.Count -ne 1 -or $verifiedSettings[0].InnerText.Trim() -ne 'true') {
            throw 'Failed to enable Core Interception blocking.'
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: |
          nuget restore submodules\IOWrapper\IOWrapper.sln -NonInteractive
          nuget restore UCR\packages.config -PackagesDirectory packages -NonInteractive
          nuget restore UCR.Core\packages.config -PackagesDirectory packages -NonInteractive
          nuget restore UCR.Tests\packages.config -PackagesDirectory packages -NonInteractive
          nuget restore UCR.FileHandler\packages.config -PackagesDirectory packages -NonInteractive

      - name: Install .NET Framework reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory .ci-reference -NonInteractive
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory .ci-reference -NonInteractive
          $net452 = (Resolve-Path ".ci-reference\Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3\build").Path
          $net461 = (Resolve-Path ".ci-reference\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build").Path
          "NET452_ROOT=$net452" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NET461_ROOT=$net461" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build IOWrapper dependencies
        shell: pwsh
        run: |
          msbuild submodules\IOWrapper\IOWrapper.sln /m /t:Rebuild /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "dependencies" | Out-Null
          Copy-Item "submodules\IOWrapper\Artifacts\*" "dependencies" -Recurse -Force

      - name: Stamp unique UCR build version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # UTC calendar day + minute of day form a monotonic four-part Windows
          # file version, independent of the two unrelated workflow run counters.
          $now = [DateTime]::UtcNow
          $buildDay = [int]($now.Date - [DateTime]::new(2020,1,1)).TotalDays
          $buildMinute = $now.Hour * 60 + $now.Minute
          $stamp = $now.ToString('yyyyMMdd.HHmmss') + 'Z'
          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+\.\d+\.\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Cannot derive UCR release version from GitVersion.yml.'
          }
          $baseVersion = $versionMatch.Groups[1].Value
          $file = '.\\UCR\\Properties\\AssemblyInfo.cs'
          $source = [System.IO.File]::ReadAllText($file)
          $numeric = "0.9.$buildDay.$buildMinute"
          $source = [regex]::Replace($source, 'AssemblyFileVersion\("[^"]+"\)',
            ('AssemblyFileVersion("' + $numeric + '")'))
          $source = [regex]::Replace($source, 'AssemblyInformationalVersion\("[^"]+"\)',
            ('AssemblyInformationalVersion("v' + $baseVersion + '-' + $stamp + '")'))
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host "UCR build identity: $baseVersion-$stamp ($numeric)"

      - name: Build release
        shell: pwsh
        run: |
          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+\.\d+\.\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Cannot derive UCR release version from GitVersion.yml.'
          }
          $baseVersion = $versionMatch.Groups[1].Value
          $common = @(
            "/m",
            "/p:Configuration=Release",
            "/p:SolutionDir=$env:GITHUB_WORKSPACE\",
            "/p:VersionNumber=$baseVersion.0",
            "/p:SkipGitVersion=true"
          )
          $net452 = $common + "/p:TargetFrameworkRootPath=$env:NET452_ROOT\"
          $net461 = $common + "/p:TargetFrameworkRootPath=$env:NET461_ROOT\"

          msbuild UCR.Core\UCR.Core.csproj @net452
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild UCR.Plugins\UCR.Plugins.csproj @net452
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild UCR.FileHandler\UCR.FileHandler.csproj @net461
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild UCR\UCR.csproj @net452
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild UCR.Tests\UCR.Tests.csproj @net452
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Interception blocking configuration
        shell: pwsh
        run: |
          [xml]$settings = Get-Content "UCR\bin\Release\Providers\Core_Interception\Settings.xml"
          $blocking = $settings.Settings.Setting |
            Where-Object { $_.Name -eq "BlockingEnabled" } |
            Select-Object -ExpandProperty Value -First 1
          if (-not [System.Convert]::ToBoolean($blocking)) {
            throw "Release artifact has Core_Interception blocking disabled."
          }

      - name: Smoke-test final IOWrapper provider composition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".\build\verify-provider-composition.ps1" -RuntimePath ".\UCR\bin\Release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          $runner = ".\\packages\\NUnit.ConsoleRunner.3.9.0\\tools\\nunit3-console.exe"
          $tests = ".\\UCR.Tests\\bin\\Release\\UCR.Tests.dll"
          # WPF Application.Current owns Dispatcher-bound theme resources. The
          # device-row materialization test must run in a separate NUnit process.
          & $runner $tests --noresult --workers=0 --where "test != HidWizards.UCR.Tests.UiTests.DeviceManagerPageSmokeTests.DeviceManagerPageMaterializesRealDeviceRowAndColourButton"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runner $tests --noresult --workers=0 --where "test == HidWizards.UCR.Tests.UiTests.DeviceManagerPageSmokeTests.DeviceManagerPageMaterializesRealDeviceRowAndColourButton"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify grouped-input XAML resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$app = Get-Content -LiteralPath '.\UCR\App.xaml' -Raw
          [xml]$mapping = Get-Content -LiteralPath '.\UCR\Views\Controls\MappingCardControl.xaml' -Raw
          $namespace = New-Object System.Xml.XmlNamespaceManager($app.NameTable)
          $namespace.AddNamespace('x', 'http://schemas.microsoft.com/winfx/2006/xaml')
          $name = 'CompactBlockSwitch'
          $styles = @($app.SelectNodes("//*[@x:Key='$name']", $namespace))
          if ($styles.Count -ne 1) {
            throw "Expected an application-scoped $name style, found $($styles.Count). Child-control resources do not reach grouped-input templates."
          }
          if ($mapping.OuterXml -notmatch "StaticResource $name") {
            throw "Grouped-input control no longer references $name; update this regression check."
          }

      - name: Smoke-test actual UCR.exe cold startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = (Resolve-Path '.\\UCR\\bin\\Release').Path
          $executable = Join-Path $runtime 'UCR.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw "UCR.exe not found: $executable" }
          $process = Start-Process -FilePath $executable -WorkingDirectory $runtime -PassThru
          $logDirectory = Join-Path $runtime 'logs'
          $startupCompleted = $false
          try {
            for ($second = 0; $second -lt 45; $second++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              $log = Join-Path $logDirectory 'UCR-latest.log'
              if ((Test-Path -LiteralPath $log) -and
                  (Select-String -LiteralPath $log -Pattern 'UCR startup completed in' -Quiet)) {
                $startupCompleted = $true
                break
              }
              if ($process.HasExited) { break }
            }
            Write-Host "Startup marker seen: $startupCompleted"
            Write-Host "Process exited: $($process.HasExited)"
            if ($process.HasExited) { Write-Host "Exit code: $($process.ExitCode)" }
            foreach ($name in @('UCR-latest.log', 'UCR-errors.log', 'LAST-CRASH.txt')) {
              $file = Join-Path $logDirectory $name
              if (Test-Path -LiteralPath $file) {
                Write-Host "=== $name ==="
                Get-Content -LiteralPath $file -Tail 90
              }
            }
            if (-not $startupCompleted) {
              throw 'UCR did not reach its successful startup marker in a clean Windows runtime.'
            }
            # WPF measures templates asynchronously AFTER the startup marker.
            # The old smoke test stopped immediately, missing a fatal resource
            # lookup 250ms later on machines with populated mapping panels.
            Start-Sleep -Seconds 4
            $process.Refresh()
            if ($process.HasExited) {
              throw "UCR terminated after reporting successful startup. Exit code: $($process.ExitCode)"
            }
            $errors = Join-Path $logDirectory 'UCR-errors.log'
            if ((Test-Path -LiteralPath $errors) -and
                (Select-String -LiteralPath $errors -Pattern 'Unhandled WPF dispatcher exception|XamlParseException|Cannot find resource named' -Quiet)) {
              Get-Content -LiteralPath $errors -Tail 60
              throw 'UCR emitted a fatal WPF UI rendering error after the startup marker.'
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload release build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UCR-Release
          path: UCR/bin/Release/**
          if-no-files-found: error
