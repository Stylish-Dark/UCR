                      var device = GetOutputDeviceReport(default(DeviceDescriptor));
                      if (mode == "reconnected") device.Nodes[0].Bindings[0].Title = "Reconnected A";
                      report.Devices.Add(device);
                  }
                  if (mode != "disconnected") {
                      var standby = GetOutputDeviceReport(default(DeviceDescriptor));
