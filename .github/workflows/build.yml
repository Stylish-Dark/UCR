name: Build UCR Stylish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Check out UCR Stylish
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Validate external UI asset targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $views = Get-ChildItem .\UCR\Views -Filter *.xaml -Recurse -File
          $allXaml = Get-ChildItem .\UCR -Filter *.xaml -Recurse -File
          $allMarkup = ($allXaml | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join [Environment]::NewLine
          $codeReferences = (Get-ChildItem .\UCR -Filter *.cs -Recurse -File | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join [Environment]::NewLine
          $failures = [System.Collections.Generic.List[string]]::new()
          $checked = 0

          foreach ($asset in Get-ChildItem .\UCR\Assets\Layouts -Filter *.xaml -File) {
            $matching = @($views | Where-Object { $_.BaseName -eq $asset.BaseName })
            if ($matching.Count -ne 1) {
              $failures.Add("Layout $($asset.Name) has $($matching.Count) compiled view matches.")
              continue
            }
            [xml]$document = Get-Content -LiteralPath $asset.FullName -Raw
            $source = Get-Content -LiteralPath $matching[0].FullName -Raw
            foreach ($entry in $document.DocumentElement.ChildNodes) {
              if ($entry.NodeType -ne [System.Xml.XmlNodeType]::Element) { continue }
              $key = $entry.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ([string]::IsNullOrWhiteSpace($key)) {
                $failures.Add("$($asset.Name): unnamed layout entry.")
                continue
              }
              $name = if ($entry.LocalName -eq 'String') { ($key -split '\.')[0] } else { $key }
              if ($source -notmatch ('\b(?:x:Name|Name)\s*=\s*["'']' + [regex]::Escape($name) + '["'']')) {
                $failures.Add("$($asset.Name): target '$name' does not exist in $($matching[0].Name).")
              }
              $checked++
            }
          }

          foreach ($asset in Get-ChildItem .\UCR\Assets\Styles -Filter *.xaml -File) {
            [xml]$document = Get-Content -LiteralPath $asset.FullName -Raw
            foreach ($entry in $document.DocumentElement.ChildNodes) {
              if ($entry.NodeType -ne [System.Xml.XmlNodeType]::Element) { continue }
              $key = $entry.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ($entry.LocalName -ne 'Style' -or [string]::IsNullOrWhiteSpace($key)) {
                $failures.Add("$($asset.Name): unsupported or unnamed external style.")
                continue
              }
              $usage = '\{(?:StaticResource|DynamicResource)\s+' + [regex]::Escape($key) + '\}'
              $codeUsage = '(?:FindResource|TryFindResource)\s*\(\s*"' + [regex]::Escape($key) + '"\s*\)'
              if ($allMarkup -notmatch $usage -and $codeReferences -notmatch $codeUsage) {
                $failures.Add("$($asset.Name): '$key' is never referenced by UCR XAML.")
              }
              $checked++
            }
          }

          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "$($failures.Count) external UI asset validation failure(s)."
          }
          Write-Host "Verified $checked external UI asset targets and references."

      - name: Verify no unapproved mapping type heading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $view = Get-Content .\UCR\Views\Controls\MappingCardControl.xaml -Raw
          $model = Get-Content .\UCR\ViewModels\ProfileViewModels\MappingViewModel.cs -Raw
          if ($view.Contains('OutputBodyGroupTitle') -or $model.Contains('OutputBodyGroupTitle')) {
            throw 'Unexpected output type text heading introduced into mapping editor.'
          }
          Write-Host 'No added output type heading.'

          # Enforce the existing symbol-first layout contract in source, without
          # launching UI automation: switch captions must sit ABOVE switches.
          [xml]$mappingXml = Get-Content .\UCR\Views\Controls\MappingCardControl.xaml -Raw
          $blocks = @($mappingXml.SelectNodes("//*[local-name()='TextBlock' and @Text='Block']"))
          if ($blocks.Count -lt 1) { throw 'Mapping Block label missing.' }
          foreach ($label in $blocks) {
            $column = $label.ParentNode
            if ($column.LocalName -ne 'StackPanel' -or
                $column.GetAttribute('Style') -notlike '*UcrLabeledSwitchColumn*' -or
                @($column.SelectNodes("./*[local-name()='ToggleButton']")).Count -ne 1) {
              throw 'Block caption must be above its switch in a shared vertical column.'
            }
          }
          [xml]$compactXml = Get-Content .\UCR\Views\Controls\CompactInputBindingControl.xaml -Raw
          $compactBlock = $compactXml.SelectSingleNode(
            "//*[local-name()='TextBlock.Style']/*[local-name()='Style']/*[local-name()='Setter' and @Property='Text' and @Value='Block']")
          if ($null -eq $compactBlock -or
              $compactBlock.ParentNode.GetAttribute('BasedOn') -notlike '*UcrLabeledSwitchCaption*') {
            throw 'Compact Block caption must use the shared caption contract.'
          }
          $compactColumn = $compactBlock.ParentNode.ParentNode.ParentNode.ParentNode
          $columnStyle = $compactColumn.SelectSingleNode(
            "./*[local-name()='StackPanel.Style']/*[local-name()='Style']")
          if ($compactColumn.LocalName -ne 'StackPanel' -or
              $null -eq $columnStyle -or
              $columnStyle.GetAttribute('BasedOn') -notlike '*UcrLabeledSwitchColumn*') {
            throw 'Compact Block switch must use the shared vertical column contract.'
          }
          # The legacy binding editor uses the same caption-above-switch rule.
          [xml]$legacyXml = Get-Content .\UCR\Views\Controls\DeviceBindingControl.xaml -Raw
          $legacyCaptions = @($legacyXml.SelectNodes(
            "//*[local-name()='TextBlock' and (@Text='Block' or @Text='Reverse')]"))
          if ($legacyCaptions.Count -ne 2) { throw 'Expected both legacy binding switch captions.' }
          foreach ($caption in $legacyCaptions) {
            $column = $caption.ParentNode
            if ($column.LocalName -ne 'StackPanel' -or
                $column.GetAttribute('Style') -notlike '*UcrLabeledSwitchColumn*' -or
                $caption.GetAttribute('Style') -notlike '*UcrLabeledSwitchCaption*' -or
                @($column.SelectNodes("./*[local-name()='ToggleButton']")).Count -ne 1) {
              throw 'Legacy switch caption must sit above its switch in the shared vertical column.'
            }
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x86

      - name: Verify Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msbuild = Get-Command msbuild -ErrorAction Stop
          $nuget = Get-Command nuget -ErrorAction Stop
          Write-Host "MSBuild: $($msbuild.Source)"
          Write-Host "NuGet:   $($nuget.Source)"
          msbuild -version
          nuget help | Select-Object -First 1

          $net452 = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5.2\mscorlib.dll"
          if (-not (Test-Path $net452)) {
            throw ".NET Framework 4.5.2 targeting pack is missing from windows-2022."
          }
          Write-Host "Verified .NET Framework 4.5.2 reference assemblies: $net452"

      - name: Ensure .NET Framework 4.6.1 Developer Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $net461 = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1\mscorlib.dll"
          if (Test-Path $net461) {
            Write-Host "Verified .NET Framework 4.6.1 reference assemblies: $net461"
            exit 0
          }

          $installer = Join-Path $env:RUNNER_TEMP 'NDP461-DevPack-KB3105179-ENU.exe'
          $downloadUri = 'https://go.microsoft.com/fwlink/?linkid=2099470'
          Invoke-WebRequest -Uri $downloadUri -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "The downloaded .NET Framework 4.6.1 Developer Pack has an invalid Authenticode signature: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw "The downloaded .NET Framework 4.6.1 Developer Pack is not signed by Microsoft Corporation. Subject: $($signature.SignerCertificate.Subject)"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          Write-Host "Verified Microsoft signature. Installer SHA-256: $hash"

          $process = Start-Process -FilePath $installer -ArgumentList '/q', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw ".NET Framework 4.6.1 Developer Pack installation failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path $net461)) {
            throw ".NET Framework 4.6.1 reference assemblies are still missing after installation."
          }
          Write-Host "Verified .NET Framework 4.6.1 reference assemblies: $net461"

      - name: Fetch exact pinned IOWrapper source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '4ef0a847fb479cfbe561656097639d3cef5240b7'
          $destination = Join-Path $PWD 'submodules\IOWrapper'

          if (Test-Path $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null

          git clone https://github.com/evilC/IOWrapper.git $destination
          git -C $destination checkout --detach $expected

          $actual = (git -C $destination rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read the checked-out IOWrapper commit.'
          }
          if ($actual -ne $expected) {
            throw "IOWrapper commit mismatch. Expected $expected, got $actual."
          }
          Write-Host "Verified IOWrapper commit: $actual"

      - name: Preserve IOWrapper input callback order
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-IOWrapperInputOrdering.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Read DirectInput axis state at subscription startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C .\submodules\IOWrapper apply "$PWD\build\ProviderPatches\DirectInputAxisSnapshot.patch"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to apply the DirectInput axis snapshot patch.'
          }

      - name: Harden Core Interception hotplug handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-CoreInterceptionHotplugSafety.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Handle Core Interception shutdown before initialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C .\submodules\IOWrapper apply "$PWD\build\ProviderPatches\CoreInterceptionPartialShutdown.patch"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to apply the Core Interception shutdown patch.'
          }

      - name: Apply Core ViGEm output lifecycle and report fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C .\submodules\IOWrapper apply "$PWD\build\ProviderPatches\CoreViGEmOutput.patch"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to apply the Core ViGEm output patch.'
          }

      - name: Apply vJoy acquisition and report fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C .\submodules\IOWrapper apply "$PWD\build\ProviderPatches\CoreVJoyOutput.patch"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to apply the vJoy output patch.'
          }

      - name: Enable Core Interception blocking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $settings = Join-Path $PWD 'submodules\IOWrapper\Source\Core Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) {
            throw "Core Interception settings file is missing: $settings"
          }

          [xml]$xml = Get-Content -LiteralPath $settings -Raw
          $blockingSettings = @($xml.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($blockingSettings.Count -ne 1) {
            throw "Expected exactly one BlockingEnabled setting, found $($blockingSettings.Count). Refusing to modify an unexpected settings layout."
          }

          $oldValue = $blockingSettings[0].InnerText.Trim()
          if ($oldValue -notin @('false', 'False', 'FALSE', 'true', 'True', 'TRUE')) {
            throw "Unexpected BlockingEnabled value: $oldValue"
          }

          $blockingSettings[0].InnerText = 'true'
          $xml.Save($settings)

          [xml]$verified = Get-Content -LiteralPath $settings -Raw
          $verifiedSettings = @($verified.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($verifiedSettings.Count -ne 1 -or $verifiedSettings[0].InnerText.Trim() -ne 'true') {
            throw 'Failed to enable Core Interception blocking.'
          }

          Write-Host "Core Interception BlockingEnabled changed from '$oldValue' to 'true'."

      - name: Restore IOWrapper NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\submodules\IOWrapper\IOWrapper.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw "IOWrapper NuGet restore failed with exit code $LASTEXITCODE."
          }

      - name: Build IOWrapper Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The pinned providers copy into a shared Artifacts tree in post-build events.
          msbuild .\submodules\IOWrapper\IOWrapper.sln /m:1 /t:Rebuild /p:Configuration=Release /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "IOWrapper Release build failed with exit code $LASTEXITCODE."
          }

          $required = @(
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.Core.dll',
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.DTOs.dll',
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.IProvider.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Expected IOWrapper artifact is missing: $file"
            }
          }
          Write-Host 'Verified required IOWrapper artifacts.'

          $interceptionSettings = '.\submodules\IOWrapper\Artifacts\Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $interceptionSettings -PathType Leaf)) {
            throw "Core Interception artifact settings are missing: $interceptionSettings"
          }
          [xml]$artifactSettings = Get-Content -LiteralPath $interceptionSettings -Raw
          $artifactBlocking = @($artifactSettings.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($artifactBlocking.Count -ne 1 -or $artifactBlocking[0].InnerText.Trim() -ne 'true') {
            throw 'Core Interception build artifact does not have BlockingEnabled=true.'
          }
          Write-Host 'Verified Core Interception build artifact has BlockingEnabled=true.'

      - name: Apply approved Core Interception DLL override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Core_ViGEm is deliberately not overridden here. Its output handlers are patched
          # from pinned source above and the provider is rebuilt by this workflow.
          $overrides = @(
            @{
              Source = '.\build\ProviderOverrides\Providers\Core_Interception\IOWrapper.Libraries.PollingDeviceHandler.dll'
              Destination = '.\submodules\IOWrapper\Artifacts\Providers\Core_Interception\IOWrapper.Libraries.PollingDeviceHandler.dll'
              Sha256 = 'dec7437219bb5b410955c0fc50d1a3f92af31cf08bc1c23ec7e5dcdfa4207b25'
            }
          )

          foreach ($override in $overrides) {
            if (-not (Test-Path -LiteralPath $override.Source -PathType Leaf)) {
              throw "Approved provider DLL is missing: $($override.Source)"
            }

            $sourceHash = (Get-FileHash -LiteralPath $override.Source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceHash -ne $override.Sha256) {
              throw "Approved provider DLL hash mismatch for $($override.Source). Expected $($override.Sha256), got $sourceHash."
            }

            $destinationDirectory = Split-Path -Parent $override.Destination
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -LiteralPath $override.Source -Destination $override.Destination -Force

            $destinationHash = (Get-FileHash -LiteralPath $override.Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($destinationHash -ne $override.Sha256) {
              throw "Provider override copy failed hash verification for $($override.Destination)."
            }
            Write-Host "Applied approved provider DLL: $($override.Destination) [$destinationHash]"
          }

      - name: Stage IOWrapper dependencies for UCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD 'submodules\IOWrapper\Artifacts'
          $destination = Join-Path $PWD 'dependencies'

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "IOWrapper artifacts directory is missing: $source"
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Recurse -Force
          }

          $sourceFiles = Get-ChildItem -LiteralPath $source -File -Recurse
          if ($sourceFiles.Count -eq 0) {
            throw "IOWrapper artifacts directory contains no files: $source"
          }

          foreach ($sourceFile in $sourceFiles) {
            $relative = $sourceFile.FullName.Substring($source.Length + 1)
            $destinationFile = Join-Path $destination $relative
            if (-not (Test-Path -LiteralPath $destinationFile -PathType Leaf)) {
              throw "IOWrapper dependency copy is incomplete. Missing: $destinationFile"
            }

            $sourceHash = (Get-FileHash -LiteralPath $sourceFile.FullName -Algorithm SHA256).Hash
            $destinationHash = (Get-FileHash -LiteralPath $destinationFile -Algorithm SHA256).Hash
            if ($sourceHash -ne $destinationHash) {
              throw "IOWrapper dependency hash mismatch for: $relative"
            }
          }

          $required = @(
            '.\dependencies\IOWrapper\IOWrapper.Core.dll',
            '.\dependencies\IOWrapper\IOWrapper.DTOs.dll',
            '.\dependencies\IOWrapper\IOWrapper.IProvider.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required UCR IOWrapper dependency is missing after staging: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Required UCR IOWrapper dependency is empty after staging: $file"
            }
          }

          $stagedInterceptionSettings = '.\dependencies\Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $stagedInterceptionSettings -PathType Leaf)) {
            throw "Staged Core Interception settings are missing: $stagedInterceptionSettings"
          }
          [xml]$stagedSettings = Get-Content -LiteralPath $stagedInterceptionSettings -Raw
          $stagedBlocking = @($stagedSettings.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($stagedBlocking.Count -ne 1 -or $stagedBlocking[0].InnerText.Trim() -ne 'true') {
            throw 'Staged Core Interception settings do not have BlockingEnabled=true.'
          }

          Write-Host "Verified $($sourceFiles.Count) IOWrapper artifact files copied byte-for-byte into dependencies."
          Write-Host 'Verified staged Core Interception settings have BlockingEnabled=true.'

      - name: Restore UCR NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageConfigs = @(
            '.\UCR\packages.config',
            '.\UCR.Core\packages.config',
            '.\UCR.FileHandler\packages.config'
          )

          foreach ($config in $packageConfigs) {
            if (-not (Test-Path $config)) {
              throw "Expected packages.config is missing: $config"
            }
            nuget restore $config -PackagesDirectory .\packages -NonInteractive
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $config with exit code $LASTEXITCODE."
            }
          }

      - name: Stamp unique UCR build version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # UTC calendar day + minute of day form a monotonic four-part Windows
          # file version, independent of the two unrelated workflow run counters.
          $now = [DateTime]::UtcNow
          $buildDay = [int]($now.Date - [DateTime]::new(2020,1,1)).TotalDays
          $buildMinute = $now.Hour * 60 + $now.Minute
          $stamp = $now.ToString('yyyyMMdd.HHmmss') + 'Z'
          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+\.\d+\.\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Cannot derive UCR release version from GitVersion.yml.'
          }
          $baseVersion = $versionMatch.Groups[1].Value
          $file = '.\\UCR\\Properties\\AssemblyInfo.cs'
          $source = [System.IO.File]::ReadAllText($file)
          $numeric = "0.9.$buildDay.$buildMinute"
          $source = [regex]::Replace($source, 'AssemblyFileVersion\("[^"]+"\)',
            ('AssemblyFileVersion("' + $numeric + '")'))
          $source = [regex]::Replace($source, 'AssemblyInformationalVersion\("[^"]+"\)',
            ('AssemblyInformationalVersion("v' + $baseVersion + '-' + $stamp + '")'))
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host "UCR build identity: $baseVersion-$stamp ($numeric)"

      - name: Build UCR Stylish Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+)\.(\d+)\.(\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Could not derive a deterministic numeric build version from GitVersion.yml next-version.'
          }

          $versionNumber = '{0}.{1}.{2}.0' -f `
            $versionMatch.Groups[1].Value, `
            $versionMatch.Groups[2].Value, `
            $versionMatch.Groups[3].Value

          Write-Host "Using deterministic VersionNumber=$versionNumber from GitVersion.yml"
          msbuild .\UCR.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:VersionNumber="$versionNumber" /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "UCR Release build failed with exit code $LASTEXITCODE."
          }

      - name: Confirm UCR.exe was built
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\UCR\bin\Release\UCR.exe' -PathType Leaf)) {
            throw 'The Windows build did not produce UCR.exe.'
          }

      - name: Verify packaged external UI assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.\UCR\bin\Release\Assets'
          $files = @(
            Get-ChildItem '.\UCR\Assets\Styles' -Filter '*.xaml' -File
            Get-ChildItem '.\UCR\Assets\Layouts' -File
            Get-ChildItem '.\UCR\Assets\Theme' -Filter '*.ini' -File
            Get-ChildItem '.\UCR\Assets\Glyphs' -Filter '*.ini' -File
          )
          foreach ($source in $files) {
            $section = Split-Path -Leaf $source.Directory.FullName
            $destination = Join-Path (Join-Path $root $section) $source.Name
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "External UI asset missing from Windows build: $section\$($source.Name)"
            }
            $expected = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
            if ($expected -ne $actual) {
              throw "Outdated external UI asset in Windows build: $section\$($source.Name)"
            }
          }
          Write-Host "Verified $($files.Count) editable UI files are packaged byte-for-byte."

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Windows
          path: UCR/bin/Release/
          if-no-files-found: error

      - name: Install verified ViGEm driver on audit runner
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'ViGEmBus_1.22.0.exe'
          Invoke-WebRequest 'https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe' -OutFile $installer
          $expected = '89220A7865076B342892F98865F3499FB7C4CFD673159E89D352C360FD014C6A'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'ViGEmBus installer did not match the published SHA-256.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Nefarius') {
            throw "Unexpected ViGEmBus signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $installLog = Join-Path $env:RUNNER_TEMP 'ucr-vigem-install.log'
          $install = Start-Process $installer -ArgumentList '/exenoui','/qn','/norestart','/L*V',$installLog -PassThru -Wait
          if ($install.ExitCode -notin @(0,3010)) {
            Write-Host "ViGEmBus setup returned $($install.ExitCode). Attempting signed INF installation."
            if (Test-Path -LiteralPath $installLog) {
              Select-String -LiteralPath $installLog -Pattern 'LaunchCondition|Return value 3' -Context 1,2 | Select-Object -Last 5 | Out-String | Write-Host
            }
            $deviceCode = @'
            using System;
            using System.ComponentModel;
            using System.Runtime.InteropServices;
            using System.Text;
  
            public static class UcrAuditBusDevice {
                [StructLayout(LayoutKind.Sequential)]
                private struct DeviceInfo {
                    public uint Size;
                    public Guid ClassGuid;
                    public uint Instance;
                    public IntPtr Reserved;
                }
  
                [DllImport("setupapi.dll", CharSet = CharSet.Unicode, SetLastError = true)]
                private static extern bool SetupDiGetINFClass(string inf, out Guid guid, StringBuilder name, int capacity, out int required);
                [DllImport("setupapi.dll", SetLastError = true)]
                private static extern IntPtr SetupDiCreateDeviceInfoList(ref Guid guid, IntPtr parent);
                [DllImport("setupapi.dll", CharSet = CharSet.Unicode, SetLastError = true)]
                private static extern bool SetupDiCreateDeviceInfo(IntPtr list, string name, ref Guid guid, string description, IntPtr parent, uint flags, ref DeviceInfo info);
                [DllImport("setupapi.dll", CharSet = CharSet.Unicode, SetLastError = true)]
                private static extern bool SetupDiSetDeviceRegistryProperty(IntPtr list, ref DeviceInfo info, uint property, byte[] buffer, uint size);
                [DllImport("setupapi.dll", SetLastError = true)]
                private static extern bool SetupDiCallClassInstaller(uint action, IntPtr list, ref DeviceInfo info);
                [DllImport("setupapi.dll")]
                private static extern bool SetupDiDestroyDeviceInfoList(IntPtr list);
  
                private static void Require(bool success) {
                    if (!success) throw new Win32Exception(Marshal.GetLastWin32Error());
                }
  
                public static void Create(string inf) {
                    Guid classGuid;
                    int required;
                    var className = new StringBuilder(255);
                    Require(SetupDiGetINFClass(inf, out classGuid, className, className.Capacity, out required));
                    var list = SetupDiCreateDeviceInfoList(ref classGuid, IntPtr.Zero);
                    Require(list != new IntPtr(-1));
                    try {
                        var device = new DeviceInfo { Size = (uint)Marshal.SizeOf(typeof(DeviceInfo)) };
                        Require(SetupDiCreateDeviceInfo(list, className.ToString(), ref classGuid,
                            "UCR audit virtual gamepad bus", IntPtr.Zero, 1, ref device));
                        var id = Encoding.Unicode.GetBytes("Nefarius\\ViGEmBus\\Gen1\0\0");
                        Require(SetupDiSetDeviceRegistryProperty(list, ref device, 1, id, (uint)id.Length));
                        Require(SetupDiCallClassInstaller(0x19, list, ref device));
                    } finally { SetupDiDestroyDeviceInfoList(list); }
                }
            }
          '@
            Add-Type -TypeDefinition $deviceCode
            $setupRoot = Join-Path $env:RUNNER_TEMP 'ucr-vigem-extract'
            $files = Join-Path $env:RUNNER_TEMP 'ucr-vigem-files'
            New-Item -ItemType Directory -Path $setupRoot,$files -Force | Out-Null
            $extract = Start-Process $installer -ArgumentList "/extract:$setupRoot",'/exenoui' -PassThru -Wait
            if ($extract.ExitCode -ne 0) { throw "Could not extract the verified ViGEm installer: $($extract.ExitCode)." }
            $msis = @(Get-ChildItem -LiteralPath $setupRoot -Filter '*.msi' -Recurse)
            $msi = $msis | Where-Object Name -match 'amd64|x64' | Select-Object -First 1
            if (-not $msi -and $msis.Count -eq 1) { $msi = $msis[0] }
            if (-not $msi) { throw "No x64 MSI was found in the verified installer. Contents: $($msis.Name -join ', ')" }
            $expand = Start-Process msiexec.exe -ArgumentList '/a',"`"$($msi.FullName)`"","TARGETDIR=$files",'/qn','/norestart' -PassThru -Wait
            if ($expand.ExitCode -notin @(0,3010)) { throw "Could not expand the signed driver files: $($expand.ExitCode)." }
            $inf = Get-ChildItem -LiteralPath $files -Filter 'ViGEmBus.inf' -Recurse | Select-Object -First 1
            if (-not $inf) { throw 'Extracted installer is missing ViGEmBus.inf.' }
            $existingBus = Get-PnpDevice -PresentOnly | Where-Object {
                $ids = (Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName 'DEVPKEY_Device_HardwareIds' -ErrorAction SilentlyContinue).Data
                $ids -contains 'Nefarius\ViGEmBus\Gen1'
            }
            if (-not $existingBus) { [UcrAuditBusDevice]::Create($inf.FullName) }
            pnputil.exe /add-driver $inf.FullName /install
            if ($LASTEXITCODE -notin @(0,3010)) { throw "Windows could not install the extracted signed driver: $LASTEXITCODE." }
          }
          Get-PnpDevice -PresentOnly | Where-Object FriendlyName -match 'ViGEm|Gamepad Emulation' | Format-List Status, FriendlyName, InstanceId

      - name: Verify UCR to ViGEm to Windows XInput
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path '.\UCR\bin\Release').Path
          $scratch = Join-Path $env:RUNNER_TEMP 'UcrNativeXinputAudit'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          Copy-Item -Path "$release\*" -Destination $scratch -Recurse -Force
          $source = Join-Path $scratch 'NativeXinputAudit.cs'
          @'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Threading;
          using HidWizards.IOWrapper.DataTransferObjects;
          using HidWizards.IOWrapper.ProviderInterface.Interfaces;
          using HidWizards.UCR.Core;
          using HidWizards.UCR.Core.Models;
          using HidWizards.UCR.Plugins.Remapper;

          internal sealed class AuditInput : IInputProvider
          {
              private readonly List<InputSubscriptionRequest> subscriptions = new List<InputSubscriptionRequest>();
              public string ProviderName { get { return "UcrAuditInput"; } }
              public bool IsLive { get { return true; } }
              public void RefreshLiveState() { }
              public void RefreshDevices() { }
              public void Dispose() { subscriptions.Clear(); }

              public bool SubscribeInput(InputSubscriptionRequest request) {
                  subscriptions.Add(request);
                  return true;
              }

              public bool UnsubscribeInput(InputSubscriptionRequest request) {
                  subscriptions.RemoveAll(item => item.SubscriptionDescriptor.SubscriberGuid == request.SubscriptionDescriptor.SubscriberGuid);
                  return true;
              }

              public void Emit(BindingType type, int index, short value) {
                  var targets = subscriptions.Where(item => item.BindingDescriptor.Type == type && item.BindingDescriptor.Index == index).ToArray();
                  if (targets.Length == 0) throw new InvalidOperationException("No UCR input subscription for " + type + " " + index);
                  foreach (var target in targets) target.Callback(value);
              }

              public DeviceReport GetInputDeviceReport(DeviceDescriptor descriptor) {
                  var device = new DeviceReport {
                      DeviceName = "Xbox audit input",
                      DeviceDescriptor = new DeviceDescriptor { DeviceHandle = "audit-pad", DeviceInstance = 0 }
                  };
                  var node = new DeviceReportNode { Title = "Audit controls" };
                  node.Bindings.Add(new BindingReport {
                      Title = "LT", Category = BindingCategory.Unsigned,
                      BindingDescriptor = new BindingDescriptor { Type = BindingType.Axis, Index = 4 }
                  });
                  foreach (var item in new[] { "A", "B7", "Right" }.Select((title,index) => new { Title=title, Index = index })) {
                      node.Bindings.Add(new BindingReport {
                          Title = item.Title, Category = BindingCategory.Momentary,
                          BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = item.Index }
                      });
                  }
                  device.Nodes.Add(node);
                  return device;
              }

              public ProviderReport GetInputList() {
                  var report = new ProviderReport {
                      Title = ProviderName, API = "Audit",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName }
                  };
                  report.Devices.Add(GetInputDeviceReport(default(DeviceDescriptor)));
                  return report;
              }
          }

          internal static class NativeXinputAudit
          {
              [StructLayout(LayoutKind.Sequential)]
              private struct XInputState {
                  public uint Packet;
                  public ushort Buttons;
                  public byte Lt, Rt;
                  public short Lx, Ly, Rx, Ry;

                  public override string ToString() { return "LT=" + Lt + " RT=" + Rt + " buttons=0x" + Buttons.ToString("X4"); }
              }

              [DllImport("xinput1_4.dll")]
              private static extern uint XInputGetState(uint slot, out XInputState state);
              [DllImport("xinput9_1_0.dll", EntryPoint="XInputGetState")]
              private static extern uint XInputGetLegacyState(uint slot, out XInputState state);

              private static object xboxHandler;
              private const BindingFlags InstanceFields = BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic;

              private static object ReadMember(object instance, string name) {
                  for (var type = instance.GetType(); type != null; type = type.BaseType) {
                      var field = type.GetField(name, InstanceFields | BindingFlags.DeclaredOnly);
                      if (field != null) return field.GetValue(instance);
                      var property = type.GetProperty(name, InstanceFields | BindingFlags.DeclaredOnly);
                      if (property != null) return property.GetValue(instance, null);
                  }
                  throw new MissingMemberException(instance.GetType().FullName, name);
              }

              private static XInputState ReadProviderReport() {
                  if (ReadMember(xboxHandler, "target") == null)
                      throw new InvalidOperationException("The installed ViGEm bus did not acquire an Xbox target.");
                  var report = ReadMember(xboxHandler, "report");
                  return new XInputState {
                      Lt = Convert.ToByte(ReadMember(report,"LeftTrigger")),
                      Rt = Convert.ToByte(ReadMember(report,"RightTrigger")),
                      Buttons = Convert.ToUInt16(ReadMember(report,"Buttons"))
                  };
              }

              private static bool ReadXInput(uint slot, out XInputState state) {
                  return XInputGetState(slot, out state) == 0 || XInputGetLegacyState(slot, out state) == 0;
              }


              public static int Main() {
                  AppDomain.CurrentDomain.AssemblyResolve += delegate(object sender, ResolveEventArgs args) {
                      var file = new AssemblyName(args.Name).Name + ".dll";
                      foreach (var path in new[] { Path.Combine("lib", file), Path.Combine("Plugins", "UCR.Plugins", file) }) {
                          if (File.Exists(path)) return Assembly.LoadFrom(Path.GetFullPath(path));
                      }
                      return null;
                  };
                  try { return Run(); }
                  catch (Exception error) { Console.Error.WriteLine(error); return 1; }
              }

              private static int Run() {
                  var failures = new List<string>();
                  WaitForDisconnected();
                  using (var context = new Context()) {
                      var input = new AuditInput();
                      const BindingFlags Private = BindingFlags.Instance | BindingFlags.NonPublic;
                      var controller = typeof(Context).GetProperty("IOController", Private).GetValue(context, null);
                      var providers = (IDictionary<string,IProvider>)controller.GetType().GetField("_providers", Private).GetValue(controller);
                      providers.Add(input.ProviderName, input);
                      var handler = ReadMember(providers["Core_ViGEm"], "devicesHandler");
                      var handlers = (System.Collections.IDictionary)ReadMember(handler, "deviceHandlers");
                      xboxHandler = ((Array)handlers["xb360"]).GetValue(0);
                      var device = context.DevicesManager.GetAvailableDeviceList(DeviceIoType.Output, false)
                          .SingleOrDefault(item => item.ProviderName == "Core_ViGEm" && item.DeviceHandle == "xb360" && item.DeviceNumber == 0);
                      if (device == null)
                          throw new InvalidOperationException("The packaged Core_ViGEm provider did not expose Xbox slot 0.");

                      var first = BuildProfile(context, device, "Analogue and button");
                      AddRoute(first, "Analogue LT to LT", new AxisToAxis(), BindingType.Axis, 4, "LT", BindingType.Axis, 4, "LT", 4, 4);
                      AddRoute(first, "Hold A", new ButtonToButton(), BindingType.Button, 0, "A", BindingType.Button, 0, "A", 3, 3);
                      Activate(context, first);
                      var slot = FindConnected();
                      Check("initial trigger rest", slot, 0, 0, 0, failures);
                      input.Emit(BindingType.Axis, 4, -32767);
                      Check("first analogue bucket", slot, 0, 0, 0, failures);
                      input.Emit(BindingType.Axis, 4, -16384);
                      Check("analogue quarter", slot, 64, 0, 0, failures);
                      input.Emit(BindingType.Axis, 4, -1);
                      Check("analogue sample below midpoint", slot, 127, 0, 0, failures);
                      input.Emit(BindingType.Axis, 4, 0);
                      Check("analogue midpoint", slot, 128, 0, 0, failures);
                      input.Emit(BindingType.Axis, 4, short.MaxValue);
                      input.Emit(BindingType.Button, 0, 1);
                      Check("analogue full and A down", slot, 255, 0, 0x1000, failures);
                      Deactivate(context, first);

                      var second = BuildProfile(context, device, "Digital trigger and direction");
                      AddRoute(second, "B7 to RT", new AxisToAxis(), BindingType.Button, 1, "B7", BindingType.Axis, 5, "RT", 3, 4);
                      AddRoute(second, "Button to Right", new ButtonToButton(), BindingType.Button, 2, "Right", BindingType.POV, 1, "Right", 3, 3);
                      Activate(context, second);
                      slot = FindConnected();
                      Check("new profile starts neutral after previous A and LT held", slot, 0, 0, 0, failures);
                      input.Emit(BindingType.Button, 1, 1);
                      Check("digital RT press", slot, 0, 255, 0, failures);
                      input.Emit(BindingType.Button, 2, 1);
                      Check("D-pad Right while RT held", slot, 0, 255, 0x0008, failures);
                      input.Emit(BindingType.Button, 1, 0);
                      Check("digital RT release with D-pad held", slot, 0, 0, 0x0008, failures);
                      input.Emit(BindingType.Button, 2, 0);
                      Check("D-pad Right released", slot, 0, 0, 0, failures);
                      Deactivate(context, second);

                      var legacy = BuildProfile(context, device, "Legacy recorded route");
                      AddRoute(legacy, "B7 to LT", new ButtonToAxis(), BindingType.Button, 1, "B7", BindingType.Axis, 4, "LT", 0, 0);
                      Activate(context, legacy);
                      slot = FindConnected();
                      input.Emit(BindingType.Button, 1, 1);
                      Check("legacy B7 to LT full press", slot, 255, 0, 0, failures);
                      input.Emit(BindingType.Button, 1, 0);
                      Check("legacy B7 to LT neutral release", slot, 0, 0, 0, failures);
                      Deactivate(context, legacy);
                  }
                  foreach (var failure in failures) Console.Error.WriteLine(failure);
                  return failures.Count == 0 ? 0 : 1;
              }

              private static Profile BuildProfile(Context context, Device output, string name) {
                  var profile = context.ProfilesManager.CreateProfile(name, null, null);
                  profile.AddDeviceConfigurations(new List<DeviceConfiguration> {
                      new DeviceConfiguration(new Device("Xbox audit input", "UcrAuditInput", "audit-pad", 0))
                  }, DeviceIoType.Input);
                  profile.AddDeviceConfigurations(new List<DeviceConfiguration> {
                      new DeviceConfiguration(new Device(output.Title, output.ProviderName, output.DeviceHandle, output.DeviceNumber))
                  }, DeviceIoType.Output);
                  context.ProfilesManager.AddProfile(profile);
                  return profile;
              }

              private static void AddRoute(Profile profile, string name, Plugin plugin,
                  BindingType inputType, int inputIndex, string inputName, BindingType outputType, int outputIndex, string outputName,
                  int inputRepresentation, int outputRepresentation) {
                  var mapping = profile.AddMapping(name);
                  if (!mapping.AddPlugin(plugin)) throw new InvalidOperationException("Could not build " + name);
                  mapping.InputRepresentation = inputRepresentation;
                  mapping.OutputRepresentation = outputRepresentation;
                  mapping.UseInputExpression = inputRepresentation != 0;
                  mapping.DirectionalCapacity = inputRepresentation != 0 ? 1 : 0;
                  var input = mapping.DeviceBindings[0];
                  input.DeviceConfigurationGuid = profile.InputDeviceConfigurations[0].Guid;
                  input.KeyType = (int)inputType;
                  input.KeyValue = inputIndex;
                  input.AssignedControlName = inputName;
                  input.IsBound = true;
                  if (inputType == BindingType.Button) {
                      input.DeviceBindingCategory = HidWizards.UCR.Core.Models.Binding.DeviceBindingCategory.Momentary;
                      input.InputExpressionInputKind = 0;
                  }
                  var output = plugin.Outputs[0];
                  output.DeviceConfigurationGuid = profile.OutputDeviceConfigurations[0].Guid;
                  output.KeyType = (int)outputType;
                  output.KeyValue = outputIndex;
                  output.AssignedControlName = outputName;
                  output.IsBound = true;
              }

              private static void Activate(Context context, Profile profile) {
                  if (!context.SubscriptionsManager.ActivateProfile(profile))
                      throw new InvalidOperationException("Could not activate " + profile.Title + ": " + context.SubscriptionsManager.LastActivationError);
              }

              private static void Deactivate(Context context, Profile profile) {
                  if (context.SubscriptionsManager.HasOutputWriteFailures)
                      throw new InvalidOperationException("ViGEm reported a failed write to UCR during " + profile.Title);
                  if (!context.SubscriptionsManager.DeactivateProfile(profile))
                      throw new InvalidOperationException("Could not deactivate " + profile.Title);
                  WaitForDisconnected();
              }

              private static uint? Connected() {
                  XInputState state;
                  uint? slot = null;
                  for (uint i = 0; i < 4; i++) {
                      if (!ReadXInput(i,out state)) continue;
                      if (slot.HasValue) throw new InvalidOperationException("Unexpected additional XInput controller.");
                      slot = i;
                  }
                  return slot;
              }

              private static uint FindConnected() {
                  var until = DateTime.UtcNow.AddSeconds(8);
                  do {
                      var slot = Connected();
                      if (slot.HasValue) return slot.Value;
                      Thread.Sleep(30);
                  } while (DateTime.UtcNow < until);
                  ReadProviderReport();
                  Console.WriteLine("XInput exposed no controller. Measuring reports accepted by the installed ViGEm provider only.");
                  return 4;
              }

              private static void WaitForDisconnected() {
                  var until = DateTime.UtcNow.AddSeconds(5);
                  do {
                      if (!Connected().HasValue) return;
                      Thread.Sleep(30);
                  } while (DateTime.UtcNow < until);
                  throw new InvalidOperationException("An XInput target remained connected.");
              }

              private static bool ReadViGEm(out XInputState state) {
                  state = ReadProviderReport();
                  return true;
              }

              private static void Check(string name, uint slot, byte lt, byte rt, ushort buttons, List<string> failures) {
                  var until = DateTime.UtcNow.AddMilliseconds(350);
                  XInputState state;
                  do {
                      var seen = slot < 4 ? ReadXInput(slot, out state) : ReadViGEm(out state);
                      if (seen && state.Lt == lt && state.Rt == rt && state.Buttons == buttons) {
                          Console.WriteLine((slot < 4 ? "Verified via XInput: " : "Verified submitted ViGEm report: ") + name + " " + state);
                          return;
                      }
                      Thread.Sleep(10);
                  } while (DateTime.UtcNow < until);
                  failures.Add(name + " expected LT=" + lt + " RT=" + rt + " buttons=0x" + buttons.ToString("X4") + " but received " + state);
              }
          }
          '@ | Set-Content -LiteralPath $source -Encoding UTF8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $references = @(
              "$scratch\lib\UCR.Core.dll",
              "$scratch\lib\IOWrapper.DTOs.dll",
              "$scratch\lib\IOWrapper.IProvider.dll",
              "$scratch\Plugins\UCR.Plugins\UCR.Plugins.dll"
          ) | ForEach-Object { "/r:$_" }
          $audit = Join-Path $scratch 'NativeXinputAudit.exe'
          & $csc /nologo "/out:$audit" @references $source
          if ($LASTEXITCODE -ne 0) { throw 'The native XInput test could not compile.' }
          Push-Location $scratch
          try {
              & $audit
              if ($LASTEXITCODE -ne 0) { throw 'Windows XInput did not receive the expected virtual controller state.' }
          } finally { Pop-Location }
