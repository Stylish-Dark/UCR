name: Build UCR Stylish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Check out UCR Stylish
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Validate external UI asset targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $views = Get-ChildItem .\UCR\Views -Filter *.xaml -Recurse -File
          $allXaml = Get-ChildItem .\UCR -Filter *.xaml -Recurse -File
          $allMarkup = ($allXaml | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join [Environment]::NewLine
          $codeReferences = (Get-ChildItem .\UCR -Filter *.cs -Recurse -File | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join [Environment]::NewLine
          $failures = [System.Collections.Generic.List[string]]::new()
          $checked = 0

          foreach ($asset in Get-ChildItem .\UCR\Assets\Layouts -Filter *.xaml -File) {
            $matching = @($views | Where-Object { $_.BaseName -eq $asset.BaseName })
            if ($matching.Count -ne 1) {
              $failures.Add("Layout $($asset.Name) has $($matching.Count) compiled view matches.")
              continue
            }
            [xml]$document = Get-Content -LiteralPath $asset.FullName -Raw
            $source = Get-Content -LiteralPath $matching[0].FullName -Raw
            foreach ($entry in $document.DocumentElement.ChildNodes) {
              if ($entry.NodeType -ne [System.Xml.XmlNodeType]::Element) { continue }
              $key = $entry.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ([string]::IsNullOrWhiteSpace($key)) {
                $failures.Add("$($asset.Name): unnamed layout entry.")
                continue
              }
              $name = if ($entry.LocalName -eq 'String') { ($key -split '\.')[0] } else { $key }
              if ($source -notmatch ('\b(?:x:Name|Name)\s*=\s*["'']' + [regex]::Escape($name) + '["'']')) {
                $failures.Add("$($asset.Name): target '$name' does not exist in $($matching[0].Name).")
              }
              $checked++
            }
          }

          foreach ($asset in Get-ChildItem .\UCR\Assets\Styles -Filter *.xaml -File) {
            [xml]$document = Get-Content -LiteralPath $asset.FullName -Raw
            foreach ($entry in $document.DocumentElement.ChildNodes) {
              if ($entry.NodeType -ne [System.Xml.XmlNodeType]::Element) { continue }
              $key = $entry.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ($entry.LocalName -ne 'Style' -or [string]::IsNullOrWhiteSpace($key)) {
                $failures.Add("$($asset.Name): unsupported or unnamed external style.")
                continue
              }
              $usage = '\{(?:StaticResource|DynamicResource)\s+' + [regex]::Escape($key) + '\}'
              $codeUsage = '(?:FindResource|TryFindResource)\s*\(\s*"' + [regex]::Escape($key) + '"\s*\)'
              if ($allMarkup -notmatch $usage -and $codeReferences -notmatch $codeUsage) {
                $failures.Add("$($asset.Name): '$key' is never referenced by UCR XAML.")
              }
              $checked++
            }
          }

          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "$($failures.Count) external UI asset validation failure(s)."
          }
          Write-Host "Verified $checked external UI asset targets and references."

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x86

      - name: Verify Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msbuild = Get-Command msbuild -ErrorAction Stop
          $nuget = Get-Command nuget -ErrorAction Stop
          Write-Host "MSBuild: $($msbuild.Source)"
          Write-Host "NuGet:   $($nuget.Source)"
          msbuild -version
          nuget help | Select-Object -First 1

          $net452 = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5.2\mscorlib.dll"
          if (-not (Test-Path $net452)) {
            throw ".NET Framework 4.5.2 targeting pack is missing from windows-2022."
          }
          Write-Host "Verified .NET Framework 4.5.2 reference assemblies: $net452"

      - name: Ensure .NET Framework 4.6.1 Developer Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $net461 = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1\mscorlib.dll"
          if (Test-Path $net461) {
            Write-Host "Verified .NET Framework 4.6.1 reference assemblies: $net461"
            exit 0
          }

          $installer = Join-Path $env:RUNNER_TEMP 'NDP461-DevPack-KB3105179-ENU.exe'
          $downloadUri = 'https://go.microsoft.com/fwlink/?linkid=2099470'
          Invoke-WebRequest -Uri $downloadUri -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "The downloaded .NET Framework 4.6.1 Developer Pack has an invalid Authenticode signature: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw "The downloaded .NET Framework 4.6.1 Developer Pack is not signed by Microsoft Corporation. Subject: $($signature.SignerCertificate.Subject)"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          Write-Host "Verified Microsoft signature. Installer SHA-256: $hash"

          $process = Start-Process -FilePath $installer -ArgumentList '/q', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw ".NET Framework 4.6.1 Developer Pack installation failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path $net461)) {
            throw ".NET Framework 4.6.1 reference assemblies are still missing after installation."
          }
          Write-Host "Verified .NET Framework 4.6.1 reference assemblies: $net461"

      - name: Fetch exact pinned IOWrapper source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '4ef0a847fb479cfbe561656097639d3cef5240b7'
          $destination = Join-Path $PWD 'submodules\IOWrapper'

          if (Test-Path $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null

          git clone https://github.com/evilC/IOWrapper.git $destination
          git -C $destination checkout --detach $expected

          $actual = (git -C $destination rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read the checked-out IOWrapper commit.'
          }
          if ($actual -ne $expected) {
            throw "IOWrapper commit mismatch. Expected $expected, got $actual."
          }
          Write-Host "Verified IOWrapper commit: $actual"

      - name: Preserve IOWrapper input callback order
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-IOWrapperInputOrdering.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Read DirectInput axis state at subscription startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C .\submodules\IOWrapper apply "$PWD\build\ProviderPatches\DirectInputAxisSnapshot.patch"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to apply the DirectInput axis snapshot patch.'
          }

      - name: Harden Core Interception hotplug handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-CoreInterceptionHotplugSafety.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Serialize Core ViGEm DS4 report writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\ProviderPatches\Apply-CoreViGEmDs4Serialization.ps1 -IOWrapperRoot .\submodules\IOWrapper

      - name: Enable Core Interception blocking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $settings = Join-Path $PWD 'submodules\IOWrapper\Source\Core Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) {
            throw "Core Interception settings file is missing: $settings"
          }

          [xml]$xml = Get-Content -LiteralPath $settings -Raw
          $blockingSettings = @($xml.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($blockingSettings.Count -ne 1) {
            throw "Expected exactly one BlockingEnabled setting, found $($blockingSettings.Count). Refusing to modify an unexpected settings layout."
          }

          $oldValue = $blockingSettings[0].InnerText.Trim()
          if ($oldValue -notin @('false', 'False', 'FALSE', 'true', 'True', 'TRUE')) {
            throw "Unexpected BlockingEnabled value: $oldValue"
          }

          $blockingSettings[0].InnerText = 'true'
          $xml.Save($settings)

          [xml]$verified = Get-Content -LiteralPath $settings -Raw
          $verifiedSettings = @($verified.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($verifiedSettings.Count -ne 1 -or $verifiedSettings[0].InnerText.Trim() -ne 'true') {
            throw 'Failed to enable Core Interception blocking.'
          }

          Write-Host "Core Interception BlockingEnabled changed from '$oldValue' to 'true'."

      - name: Restore IOWrapper NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\submodules\IOWrapper\IOWrapper.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw "IOWrapper NuGet restore failed with exit code $LASTEXITCODE."
          }

      - name: Build IOWrapper Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild .\submodules\IOWrapper\IOWrapper.sln /m /t:Rebuild /p:Configuration=Release /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "IOWrapper Release build failed with exit code $LASTEXITCODE."
          }

          $required = @(
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.Core.dll',
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.DTOs.dll',
            '.\submodules\IOWrapper\Artifacts\IOWrapper\IOWrapper.IProvider.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Expected IOWrapper artifact is missing: $file"
            }
          }
          Write-Host 'Verified required IOWrapper artifacts.'

          $interceptionSettings = '.\submodules\IOWrapper\Artifacts\Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $interceptionSettings -PathType Leaf)) {
            throw "Core Interception artifact settings are missing: $interceptionSettings"
          }
          [xml]$artifactSettings = Get-Content -LiteralPath $interceptionSettings -Raw
          $artifactBlocking = @($artifactSettings.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($artifactBlocking.Count -ne 1 -or $artifactBlocking[0].InnerText.Trim() -ne 'true') {
            throw 'Core Interception build artifact does not have BlockingEnabled=true.'
          }
          Write-Host 'Verified Core Interception build artifact has BlockingEnabled=true.'

      - name: Apply approved Core Interception DLL override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Core_ViGEm is deliberately not overridden here. Its DS4 handler is patched
          # from pinned source above and the provider is rebuilt by this workflow.
          $overrides = @(
            @{
              Source = '.\build\ProviderOverrides\Providers\Core_Interception\IOWrapper.Libraries.PollingDeviceHandler.dll'
              Destination = '.\submodules\IOWrapper\Artifacts\Providers\Core_Interception\IOWrapper.Libraries.PollingDeviceHandler.dll'
              Sha256 = 'dec7437219bb5b410955c0fc50d1a3f92af31cf08bc1c23ec7e5dcdfa4207b25'
            }
          )

          foreach ($override in $overrides) {
            if (-not (Test-Path -LiteralPath $override.Source -PathType Leaf)) {
              throw "Approved provider DLL is missing: $($override.Source)"
            }

            $sourceHash = (Get-FileHash -LiteralPath $override.Source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceHash -ne $override.Sha256) {
              throw "Approved provider DLL hash mismatch for $($override.Source). Expected $($override.Sha256), got $sourceHash."
            }

            $destinationDirectory = Split-Path -Parent $override.Destination
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -LiteralPath $override.Source -Destination $override.Destination -Force

            $destinationHash = (Get-FileHash -LiteralPath $override.Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($destinationHash -ne $override.Sha256) {
              throw "Provider override copy failed hash verification for $($override.Destination)."
            }
            Write-Host "Applied approved provider DLL: $($override.Destination) [$destinationHash]"
          }

      - name: Stage IOWrapper dependencies for UCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD 'submodules\IOWrapper\Artifacts'
          $destination = Join-Path $PWD 'dependencies'

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "IOWrapper artifacts directory is missing: $source"
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Recurse -Force
          }

          $sourceFiles = Get-ChildItem -LiteralPath $source -File -Recurse
          if ($sourceFiles.Count -eq 0) {
            throw "IOWrapper artifacts directory contains no files: $source"
          }

          foreach ($sourceFile in $sourceFiles) {
            $relative = $sourceFile.FullName.Substring($source.Length + 1)
            $destinationFile = Join-Path $destination $relative
            if (-not (Test-Path -LiteralPath $destinationFile -PathType Leaf)) {
              throw "IOWrapper dependency copy is incomplete. Missing: $destinationFile"
            }

            $sourceHash = (Get-FileHash -LiteralPath $sourceFile.FullName -Algorithm SHA256).Hash
            $destinationHash = (Get-FileHash -LiteralPath $destinationFile -Algorithm SHA256).Hash
            if ($sourceHash -ne $destinationHash) {
              throw "IOWrapper dependency hash mismatch for: $relative"
            }
          }

          $required = @(
            '.\dependencies\IOWrapper\IOWrapper.Core.dll',
            '.\dependencies\IOWrapper\IOWrapper.DTOs.dll',
            '.\dependencies\IOWrapper\IOWrapper.IProvider.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required UCR IOWrapper dependency is missing after staging: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Required UCR IOWrapper dependency is empty after staging: $file"
            }
          }

          $stagedInterceptionSettings = '.\dependencies\Providers\Core_Interception\Settings.xml'
          if (-not (Test-Path -LiteralPath $stagedInterceptionSettings -PathType Leaf)) {
            throw "Staged Core Interception settings are missing: $stagedInterceptionSettings"
          }
          [xml]$stagedSettings = Get-Content -LiteralPath $stagedInterceptionSettings -Raw
          $stagedBlocking = @($stagedSettings.SelectNodes('/Settings/Setting[Name="BlockingEnabled"]/Value'))
          if ($stagedBlocking.Count -ne 1 -or $stagedBlocking[0].InnerText.Trim() -ne 'true') {
            throw 'Staged Core Interception settings do not have BlockingEnabled=true.'
          }

          Write-Host "Verified $($sourceFiles.Count) IOWrapper artifact files copied byte-for-byte into dependencies."
          Write-Host 'Verified staged Core Interception settings have BlockingEnabled=true.'

      - name: Restore UCR NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageConfigs = @(
            '.\UCR\packages.config',
            '.\UCR.Core\packages.config',
            '.\UCR.FileHandler\packages.config'
          )

          foreach ($config in $packageConfigs) {
            if (-not (Test-Path $config)) {
              throw "Expected packages.config is missing: $config"
            }
            nuget restore $config -PackagesDirectory .\packages -NonInteractive
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $config with exit code $LASTEXITCODE."
            }
          }

      - name: Stamp unique UCR build version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # UTC calendar day + minute of day form a monotonic four-part Windows
          # file version, independent of the two unrelated workflow run counters.
          $now = [DateTime]::UtcNow
          $buildDay = [int]($now.Date - [DateTime]::new(2020,1,1)).TotalDays
          $buildMinute = $now.Hour * 60 + $now.Minute
          $stamp = $now.ToString('yyyyMMdd.HHmmss') + 'Z'
          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+\.\d+\.\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Cannot derive UCR release version from GitVersion.yml.'
          }
          $baseVersion = $versionMatch.Groups[1].Value
          $file = '.\\UCR\\Properties\\AssemblyInfo.cs'
          $source = [System.IO.File]::ReadAllText($file)
          $numeric = "0.9.$buildDay.$buildMinute"
          $source = [regex]::Replace($source, 'AssemblyFileVersion\("[^"]+"\)',
            ('AssemblyFileVersion("' + $numeric + '")'))
          $source = [regex]::Replace($source, 'AssemblyInformationalVersion\("[^"]+"\)',
            ('AssemblyInformationalVersion("v' + $baseVersion + '-' + $stamp + '")'))
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host "UCR build identity: $baseVersion-$stamp ($numeric)"

      - name: Build UCR Stylish Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $gitVersionConfig = Get-Content -LiteralPath '.\GitVersion.yml' -Raw
          $versionMatch = [regex]::Match($gitVersionConfig, '(?m)^next-version:\s*(\d+)\.(\d+)\.(\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw 'Could not derive a deterministic numeric build version from GitVersion.yml next-version.'
          }

          $versionNumber = '{0}.{1}.{2}.0' -f `
            $versionMatch.Groups[1].Value, `
            $versionMatch.Groups[2].Value, `
            $versionMatch.Groups[3].Value

          Write-Host "Using deterministic VersionNumber=$versionNumber from GitVersion.yml"
          msbuild .\UCR.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:VersionNumber="$versionNumber" /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "UCR Release build failed with exit code $LASTEXITCODE."
          }

      - name: Confirm UCR.exe was built
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\UCR\bin\Release\UCR.exe' -PathType Leaf)) {
            throw 'The Windows build did not produce UCR.exe.'
          }

      - name: Verify packaged external UI assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.\UCR\bin\Release\Assets'
          $files = @(
            Get-ChildItem '.\UCR\Assets\Styles' -Filter '*.xaml' -File
            Get-ChildItem '.\UCR\Assets\Layouts' -File
            Get-ChildItem '.\UCR\Assets\Theme' -Filter '*.ini' -File
            Get-ChildItem '.\UCR\Assets\Glyphs' -Filter '*.ini' -File
          )
          foreach ($source in $files) {
            $section = Split-Path -Leaf $source.Directory.FullName
            $destination = Join-Path (Join-Path $root $section) $source.Name
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "External UI asset missing from Windows build: $section\$($source.Name)"
            }
            $expected = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
            if ($expected -ne $actual) {
              throw "Outdated external UI asset in Windows build: $section\$($source.Name)"
            }
          }
          Write-Host "Verified $($files.Count) editable UI files are packaged byte-for-byte."

      - name: Capture UCR UI on Windows runner
        id: visual_audit
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'UCR-Visual-Audit'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $exe = (Resolve-Path '.\UCR\bin\Release\UCR.exe').Path

          # Runner-only saved DualSense binding fixture. No simulated hardware
          # signal is claimed; this exercises the actual app's persisted glyph.
          $dataRoot = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'UCR'
          $profileFolder = Join-Path $dataRoot 'Profiles'
          New-Item -ItemType Directory -Path $profileFolder -Force | Out-Null
          $profileId = [guid]::NewGuid().ToString('D')
          $deviceId = [guid]::NewGuid().ToString('D')
          $testProfile = @{
            guid = $profileId
            title = 'DualSense button verification'
            childProfiles = @()
            mappings = @(
              @{
                title = 'Cross to A'
                deviceBindings = @(
                  @{
                    isBound = $true
                    deviceConfigurationGuid = $deviceId
                    keyType = 1
                    keyValue = 49
                    keySubValue = 0
                  }
                )
                plugins = @(
                  @{
                    pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
                    data = @{
                      outputs = @()
                      filters = @()
                    }
                  }
                )
              }
            )
            mappingGroups = @()
            inputDeviceConfigurations = @(
              @{
                guid = $deviceId
                device = @{
                  title = 'DualSense Wireless Controller'
                  providerName = 'SharpDX_DirectInput'
                  deviceHandle = 'UCR_DUALSENSE_VISUAL_AUDIT'
                  deviceNumber = 0
                  hidPath = 'HID\VID_054C&PID_0CE6'
                }
                shadowDevices = @()
              }
            )
            outputDeviceConfigurations = @(
              @{
                guid = [guid]::NewGuid().ToString('D')
                device = @{
                  title = 'Xbox 360 Controller'
                  providerName = 'Core_ViGEm'
                  deviceHandle = 'xb360'
                  deviceNumber = 0
                }
                shadowDevices = @()
              }
            )
            autoActivateApplications = @()
          }
          @{ schemaVersion = 1; profileOrder = @($profileId) } |
            ConvertTo-Json -Depth 20 |
            Set-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Encoding UTF8
          @{ schemaVersion = 1; deviceAliases = @() } |
            ConvertTo-Json -Depth 20 |
            Set-Content -LiteralPath (Join-Path $dataRoot 'devices.json') -Encoding UTF8
          @{ schemaVersion = 1; profile = $testProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($profileId + '.json')) -Encoding UTF8

          # Capture the real compiled WPF window, not a generated mockup
          # or a screenshot from the user's computer.
          Add-Type -ReferencedAssemblies @('System.Drawing') -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Drawing;
          using System.Drawing.Imaging;
          using System.Runtime.InteropServices;
          public static class UcrWindowCapture {
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              private static extern bool GetWindowRect(IntPtr hwnd, out Rect rectangle);
              [DllImport("user32.dll")]
              private static extern bool PrintWindow(IntPtr hwnd, IntPtr dc, uint flags);
              [DllImport("user32.dll")]
              public static extern bool MoveWindow(IntPtr hwnd, int x, int y, int width, int height, bool repaint);
              [DllImport("user32.dll")]
              private static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")]
              private static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extra);
              public static void RightClick(int x, int y) {
                  if (!SetCursorPos(x, y)) throw new Exception("Could not move to the profile row");
                  mouse_event(8, 0, 0, 0, UIntPtr.Zero);
                  mouse_event(16, 0, 0, 0, UIntPtr.Zero);
              }
              public static int Capture(IntPtr hwnd, string filename) {
                  Rect r;
                  if (!GetWindowRect(hwnd, out r)) throw new Exception("GetWindowRect failed");
                  bool sidebar = filename.IndexOf("-sidebar", StringComparison.OrdinalIgnoreCase) >= 0;
                  int captureLeft = sidebar ? Math.Max(0, r.Left) : r.Left;
                  int w = r.Right - captureLeft, h = r.Bottom - r.Top;
                  if (w < 300 || h < 250 || w > 6000 || h > 4000)
                      throw new Exception("Implausible application window dimensions: " + w + "x" + h);
                  using (var bitmap = new Bitmap(w, h, PixelFormat.Format32bppArgb)) {
                      using (var g = Graphics.FromImage(bitmap)) {
                          g.Clear(Color.Black);
                          bool popup = filename.IndexOf("picker", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("add-device", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("about-dialog", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("profile-rename", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("-menu", StringComparison.OrdinalIgnoreCase) >= 0;
                          if (popup || sidebar) {
                              g.CopyFromScreen(captureLeft, r.Top, 0, 0, new Size(w, h));
                          } else {
                              IntPtr dc = g.GetHdc();
                              try {
                                  if (!PrintWindow(hwnd, dc, 2) && !PrintWindow(hwnd, dc, 0))
                                      throw new Exception("PrintWindow could not render UCR");
                              } finally { g.ReleaseHdc(dc); }
                          }
                      }
                      var colors = new HashSet<int>();
                      for (int y = 8; y < h - 8; y += Math.Max(1, h / 35))
                          for (int x = 8; x < w - 8; x += Math.Max(1, w / 35))
                              colors.Add(bitmap.GetPixel(x,y).ToArgb());
                      if (colors.Count < 12)
                          throw new Exception("Screenshot blank or unrendered (" + colors.Count + " sampled colors)");
                      bitmap.Save(filename, ImageFormat.Png);
                      return colors.Count;
                  }
              }
          }
          '@

          $process = $null
          try {
              $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
              $handle = [IntPtr]::Zero
              $title = ''
              $deadline = (Get-Date).AddSeconds(65)
              do {
                  Start-Sleep -Milliseconds 900
                  $process.Refresh()
                  if ($process.HasExited) {
                      throw "UCR exited during visual audit with code $($process.ExitCode)"
                  }
                  $title = $process.MainWindowTitle
                  if ($process.MainWindowHandle -ne [IntPtr]::Zero -and
                      $title -match '(Universal Control Remapper|UCR)' -and
                      $title -notmatch '(Splash|Starting)') {
                      $handle = $process.MainWindowHandle
                      break
                  }
              } while ((Get-Date) -lt $deadline)
              if ($handle -eq [IntPtr]::Zero) {
                  throw "UCR did not expose its main window within 65 seconds (last title: '$title')."
              }
              Start-Sleep -Seconds 3
              Add-Type -AssemblyName UIAutomationClient
              Add-Type -AssemblyName System.Windows.Forms
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
              $processCondition = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
              function Find-UcrElement($property, [string]$value) {
                  $condition = [System.Windows.Automation.PropertyCondition]::new($property, $value)
                  for ($attempt = 0; $attempt -lt 20; $attempt++) {
                      $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                          [System.Windows.Automation.TreeScope]::Children, $processCondition)
                      foreach ($window in $windows) {
                          $matches = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
                          foreach ($element in $matches) {
                              if (-not $element.Current.IsOffscreen) { return $element }
                          }
                      }
                      Start-Sleep -Milliseconds 150
                  }
                  throw "Visible UI element missing: $value"
              }
              function Find-UcrControl([string]$id) {
                  Find-UcrElement ([System.Windows.Automation.AutomationElement]::AutomationIdProperty) $id
              }
              function Invoke-UcrControl([string]$id) {
                  $element = Find-UcrControl $id
                  $element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              }
              function Set-UcrText([string]$id, [string]$text) {
                  $element = Find-UcrControl $id
                  $element.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($text)
              }
              function Get-UcrControls([string]$id) {
                  $condition = [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::AutomationIdProperty, $id)
                  return $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              }
              function Assert-UcrDirectionCross([string]$id) {
                  $bounds = @(Get-UcrControls $id | Where-Object { -not $_.Current.IsOffscreen } |
                      ForEach-Object { $_.Current.BoundingRectangle } |
                      Sort-Object Y, X)
                  if ($bounds.Count -ne 4 -or
                      $bounds[0].Y -ge $bounds[1].Y -or $bounds[2].Y -ge $bounds[3].Y -or
                      [Math]::Abs($bounds[1].Y - $bounds[2].Y) -gt 2 -or
                      [Math]::Abs($bounds[0].X - $bounds[3].X) -gt 2 -or
                      $bounds[1].X -ge $bounds[0].X -or $bounds[2].X -le $bounds[0].X) {
                      throw "Expected four direction buttons arranged in a cross ($id)."
                  }
              }
              function Find-UcrProfileRow([string]$name) {
                  $condition = [System.Windows.Automation.AndCondition]::new(
                      [System.Windows.Automation.PropertyCondition]::new(
                          [System.Windows.Automation.AutomationElement]::NameProperty, $name),
                      [System.Windows.Automation.PropertyCondition]::new(
                          [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                          [System.Windows.Automation.ControlType]::TreeItem))
                  return $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
              }
              function Assert-UcrSelectedProfile([string]$name) {
                  $item = Find-UcrProfileRow $name
                  if ($null -eq $item -or -not $item.GetCurrentPattern(
                      [System.Windows.Automation.SelectionItemPattern]::Pattern).Current.IsSelected) {
                      throw "Profile tree did not select '$name'."
                  }
              }
              $nameProperty = [System.Windows.Automation.AutomationElement]::NameProperty
              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 500
              $elements = $root.FindAll(
                  [System.Windows.Automation.TreeScope]::Subtree,
                  [System.Windows.Automation.Condition]::TrueCondition)
              $labels = @()
              foreach ($element in $elements) {
                  try {
                      $name = $element.Current.Name
                      if ($name) { $labels += $name }
                  } catch {}
              }
              $labels | Set-Content -LiteralPath (Join-Path $directory 'UI-elements.txt')
              $outFile = Join-Path $directory 'UCR-main.png'
              $uniqueColors = [UcrWindowCapture]::Capture($handle, $outFile)
              if (-not (Test-Path -LiteralPath $outFile)) {
                  throw 'The PNG capture was not created.'
              }
              Write-Host "Captured actual UCR window: $outFile ($uniqueColors distinct sampled colors)"
              Write-Host "UI automation elements: $($elements.Count); named: $($labels.Count)"
              Assert-UcrSelectedProfile 'DualSense button verification'
              [UcrWindowCapture]::MoveWindow($handle, -390, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 500
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-devices-sidebar.png')) | Out-Null
              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 400
              if ((Find-UcrControl 'UiMappingTitle').Current.Name -ne 'Cross to A') {
                  throw 'The saved mapping title is missing from the workspace.'
              }
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-DualSense-bound-cross.png')) | Out-Null
              Invoke-UcrControl 'UiExpandMapping'
              Start-Sleep -Milliseconds 850
              # The canonical binding control has no visible ellipsis: options
              # are opened by right-clicking the Bind action itself.
              if (@(Get-UcrControls 'UiInputBindingOptions' | Where-Object { -not $_.Current.IsOffscreen }).Count -ne 0) {
                  throw 'An obsolete binding ellipsis is still visible.'
              }
              $inputBind = Find-UcrControl 'BindButton'
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-DualSense-expanded-cross.png')) | Out-Null
              $bindRect = $inputBind.Current.BoundingRectangle
              [UcrWindowCapture]::RightClick(
                  [int]($bindRect.X + $bindRect.Width / 2),
                  [int]($bindRect.Y + $bindRect.Height / 2))
              Find-UcrElement $nameProperty 'Clear binding' | Out-Null
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-input-binding-menu.png')) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')

              Invoke-UcrControl 'UiToolbarHelp'
              Find-UcrControl 'UiHelpContents' | Out-Null
              Find-UcrControl 'UiAbout' | Out-Null
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-help-menu.png')) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')

              Set-UcrText 'WorkspaceMappingSearch' 'No such mapping'
              Start-Sleep -Milliseconds 500
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-mapping-search.png')) | Out-Null
              $visibleMappings = $root.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'UiMappingTitle'))
              foreach ($mapping in $visibleMappings) {
                  if (-not $mapping.Current.IsOffscreen) { throw 'Search did not hide a nonmatching mapping.' }
              }
              Set-UcrText 'WorkspaceMappingSearch' ''
              Find-UcrControl 'UiMappingTitle' | Out-Null

              Invoke-UcrControl 'UiProfilesAdd'
              Start-Sleep -Seconds 4
              $process.Refresh()
              if ($process.HasExited) {
                  throw 'UCR crashed after creating the visual-audit profile.'
              }
              $profilePath = Join-Path $directory 'UCR-profile.png'
              $profileColors = [UcrWindowCapture]::Capture($handle, $profilePath)
              Assert-UcrSelectedProfile 'New profile'
              if ((Find-UcrControl 'WorkspaceProfileTitle').Current.Name -ne 'New profile') {
                  throw 'The workspace did not open the newly selected profile.'
              }
              $search = Find-UcrControl 'WorkspaceMappingSearch'
              $search.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('^{ENTER}')
              [System.Windows.Forms.SendKeys]::SendWait('^+{ENTER}')
              Start-Sleep -Milliseconds 550
              if ((Find-UcrControl 'UiToolbarStop').Current.IsEnabled) {
                  throw 'A profile activation shortcut ran while the mapping search box had focus.'
              }
              Invoke-UcrControl 'UiToolbarHelp'
              Invoke-UcrControl 'UiAbout'
              Find-UcrControl 'UiAboutSourceLink' | Out-Null
              Start-Sleep -Milliseconds 350
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-about-dialog.png')) | Out-Null
              $closeAbout = Find-UcrControl 'UiClose'
              $closeAbout.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('^{ENTER}')
              Start-Sleep -Milliseconds 350
              # The focused dialog button may close About itself.
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Start-Sleep -Milliseconds 350
              if ((Find-UcrControl 'UiToolbarStop').Current.IsEnabled) {
                  throw 'A profile activation shortcut ran through a modal dialog.'
              }
              $editorElements = $root.FindAll(
                  [System.Windows.Automation.TreeScope]::Subtree,
                  [System.Windows.Automation.Condition]::TrueCondition)
              $editorLabels = @()
              foreach ($element in $editorElements) {
                  try {
                      $name = $element.Current.Name
                      if ($name) { $editorLabels += $name }
                  } catch {}
              }
              $editorLabels | Set-Content -LiteralPath (Join-Path $directory 'Profile-UI-elements.txt')

              $profileRow = Find-UcrProfileRow 'DualSense button verification'
              $rowBounds = $profileRow.Current.BoundingRectangle
              [UcrWindowCapture]::RightClick([int]($rowBounds.Left + 75), [int]($rowBounds.Top + $rowBounds.Height / 2))
              Start-Sleep -Milliseconds 400
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-profile-menu.png')) | Out-Null
              Find-UcrControl 'UiProfileCopy' | Out-Null
              Find-UcrControl 'UiProfileExport' | Out-Null
              Invoke-UcrControl 'UiProfileCopy'
              $copyName = (Find-UcrControl 'UiProfileNameInput').GetCurrentPattern(
                  [System.Windows.Automation.ValuePattern]::Pattern).Current.Value
              if ($copyName -ne 'DualSense button verification Copy') { throw 'The profile menu targeted the wrong profile.' }
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Start-Sleep -Milliseconds 400
              Assert-UcrSelectedProfile 'New profile'
              Invoke-UcrControl 'UiProfileRename'
              Set-UcrText 'UiProfileNameInput' '   '
              Start-Sleep -Milliseconds 350
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-profile-rename.png')) | Out-Null
              if ((Find-UcrControl 'UiProfileNameAccept').Current.IsEnabled) {
                  throw 'Rename accepts a whitespace-only name.'
              }
              Set-UcrText 'UiProfileNameInput' 'Windows audit renamed profile'
              Invoke-UcrControl 'UiProfileNameAccept'
              Start-Sleep -Milliseconds 600
              Assert-UcrSelectedProfile 'Windows audit renamed profile'
              if ((Find-UcrControl 'WorkspaceProfileTitle').Current.Name -ne 'Windows audit renamed profile') {
                  throw 'The selected profile and workspace disagree after rename.'
              }
              # Open the actual output-device picker to inspect MIDI identification.
              [UcrWindowCapture]::MoveWindow($handle, -390, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 400
              Invoke-UcrControl 'UiProfileAddOutputDevice'
              Start-Sleep -Milliseconds 950
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-output-device-picker.png')) | Out-Null
              if ((Find-UcrControl 'UiConfirmAddDevices').Current.IsEnabled) {
                  throw 'Add Devices accepts an empty selection.'
              }
              $deviceChoice = Find-UcrControl 'UiAddDeviceChoice'
              $deviceToggle = $deviceChoice.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
              $deviceToggle.Toggle()
              Start-Sleep -Milliseconds 350
              if (-not (Find-UcrControl 'UiConfirmAddDevices').Current.IsEnabled) {
                  throw 'Add Devices stays disabled after selecting a device.'
              }
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-output-device-picker-selected.png')) | Out-Null
              $deviceToggle.Toggle()
              Start-Sleep -Milliseconds 350
              if ((Find-UcrControl 'UiConfirmAddDevices').Current.IsEnabled) {
                  throw 'Add Devices stays enabled after clearing the last device.'
              }
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Start-Sleep -Milliseconds 400

              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 400

              # Inspect the real profile input-device selector with a cached
              # DualSense HID fixture. Escape closes the modal before mapping tests.
              [UcrWindowCapture]::MoveWindow($handle, -390, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 400
              Invoke-UcrControl 'UiProfileAddInputDevice'
              Start-Sleep -Milliseconds 850
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-DualSense-add-device.png')) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Start-Sleep -Milliseconds 450
              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 740, $true) | Out-Null
              Start-Sleep -Milliseconds 350

              Invoke-UcrControl 'UiWorkspaceMore'
              Find-UcrElement $nameProperty 'Batch capture inputs' | Out-Null
              $batchAssign = Find-UcrElement $nameProperty 'Batch assign outputs'
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-batch-menu.png')) | Out-Null
              $batchAssign.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Find-UcrElement $nameProperty 'No unassigned Button-to-Button mappings. Capture some inputs first.' | Out-Null
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-batch-assign.png')) | Out-Null
              Invoke-UcrControl 'UiFinishBatchMappings'

              $directionProfile = Find-UcrProfileRow 'DualSense button verification'
              $directionProfile.GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Assert-UcrSelectedProfile 'DualSense button verification'
              $fourWayOutput = Find-UcrControl 'UiMappingFourWayOutput'
              $fourWayOutput.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
              Start-Sleep -Milliseconds 550
              $directions = @(Get-UcrControls 'UiMappingDirectionBind')
              if ($directions.Count -ne 4) { throw 'Could not find the four expanded direction buttons.' }
              $directions[0].SetFocus()
              Start-Sleep -Milliseconds 400
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-four-way-expanded.png')) | Out-Null
              Assert-UcrDirectionCross 'UiMappingDirectionBind'
              $expand = @(Get-UcrControls 'UiExpandMapping')[0]
              $expand.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 450
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-four-way-collapsed.png')) | Out-Null
              Assert-UcrDirectionCross 'UiWorkspaceDirectionBind'

              $editProfile = Find-UcrProfileRow 'Windows audit renamed profile'
              $editProfile.GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Assert-UcrSelectedProfile 'Windows audit renamed profile'

              Invoke-UcrControl 'UiInspectorAddFilter'
              $buttonFilter = Find-UcrElement $nameProperty 'Button filter'
              $buttonFilter.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Invoke-UcrControl 'UiProfileNameAccept'
              Invoke-UcrControl 'UiToolbarSave'
              Invoke-UcrControl 'UiExpandMapping'
              $settings = Find-UcrControl 'UiMappingOutputSettings'
              $settings.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()
              $filterName = Find-UcrControl 'UiFilterName'
              $filterName.SetFocus()
              $filterValue = $filterName.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              $filterValue.SetValue('Saved without leaving focus')
              if ($filterValue.Current.Value -ne 'Saved without leaving focus') {
                  throw "The filter name edit did not reach the textbox: $($filterValue.Current.Value)"
              }
              if (-not $filterName.Current.HasKeyboardFocus) {
                  throw 'The filter editor did not receive keyboard focus.'
              }
              [System.Windows.Forms.SendKeys]::SendWait('^s')
              Start-Sleep -Milliseconds 650
              [UcrWindowCapture]::Capture(
                  $handle, (Join-Path $directory 'UCR-filter-name-saved.png')) | Out-Null
              $snapshot = Get-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Raw | ConvertFrom-Json
              $savedProfile = $snapshot.profiles | Where-Object { $_.title -eq 'Windows audit renamed profile' }
              $savedName = $savedProfile.mappings.plugins.data.filterName
              if ($savedName -ne 'Saved without leaving focus') {
                  throw 'Ctrl+S did not persist the edited filter name.'
              }

              # Exercise the actual mapping-creation control and capture populated UI.
              for ($i = 0; $i -lt 3; $i++) {
                  Invoke-UcrControl 'UiWorkspaceAddMapping'
                  Start-Sleep -Milliseconds 1250
                  if ($i -eq 0) {
                      [UcrWindowCapture]::Capture(
                          $handle, (Join-Path $directory 'UCR-first-button-mapping.png')) | Out-Null
                  }
              }
              Start-Sleep -Seconds 2
              $populated = Join-Path $directory 'UCR-mappings.png'
              $populatedColors = [UcrWindowCapture]::Capture($handle, $populated)
              $populatedElements = $root.FindAll(
                  [System.Windows.Automation.TreeScope]::Subtree,
                  [System.Windows.Automation.Condition]::TrueCondition)
              $mappingLabels = @()
              foreach ($element in $populatedElements) {
                  try {
                      $name = $element.Current.Name
                      if ($name) { $mappingLabels += $name }
                  } catch {}
              }
              $mappingLabels | Set-Content -LiteralPath (Join-Path $directory 'Mapping-UI-elements.txt')
              Write-Host "Captured populated mappings: $populated ($populatedColors colors)"

              Write-Host "Captured live profile editor: $profilePath ($profileColors colors, $($editorElements.Count) UIA elements)"
          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath (Join-Path $directory 'capture-error.txt')
              Write-Error $_
              throw
          }
          finally {
              if ($null -ne $process) {
                  try { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } } catch {}
              }
          }

      - name: Upload UCR visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Visual-Audit
          path: ${{ runner.temp }}/UCR-Visual-Audit/
          if-no-files-found: warn

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Windows
          path: UCR/bin/Release/
          if-no-files-found: error
