              Write-Host 'PASS Rebinding in the expanded picker updates the collapsed picker'
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Open-OutputPicker 'Individual vJoy output'
              (Find-UcrElement $nameProperty 'Clear binding').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Save-UcrIfNeeded
              $saved = Read-UcrState
              $profile = @($saved.profiles | Where-Object title -eq 'Individual vJoy output')[0]
              $output = $profile.mappings[0].plugins[0].data.outputs[0]
              if ($output.isBound -or $output.assignedControlName -or [int]$output.keyValue -ne 0) {
                  throw 'Clearing the POV left a stale output descriptor.'
              }
              Write-Host 'PASS Clearing a vJoy direction removes the saved descriptor and name'

              [UcrWindowCapture]::MoveWindow($handle, 30, 30, 1600, 980, $true) | Out-Null
              (Find-UcrProfileRow 'Binding controls').GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep -Milliseconds 500
              if (@(Get-UcrControls 'UiMappingOutputHeading' | Where-Object { -not $_.Current.IsOffscreen }).Count -eq 0) {
                  Invoke-UcrControl 'UiExpandMapping'
              }
              $options = @(Get-UcrControls 'UiBindingOptions' | Where-Object { -not $_.Current.IsOffscreen })
              if ($options.Count -ne 5) { throw "Expected four input menus and one output menu, got $($options.Count)." }
              $inputOptions = @($options | Where-Object { $_.Current.Name -eq 'Input binding options' } | Sort-Object { $_.Current.BoundingRectangle.Top })
              $outputOptions = @($options | Where-Object { $_.Current.Name -eq 'Output binding options' })[0]
              if ($inputOptions.Count -ne 4 -or $null -eq $outputOptions) { throw 'Input/output binding menus are missing.' }
              $inputOptions[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Find-UcrElement $nameProperty 'Clear binding' | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS Every input and output row has its own working vertical ellipsis menu'
              $block = Find-UcrControl 'UiBindingBlockSwitch'
              if (-not $block.Current.IsEnabled -or $block.Current.HelpText -like '*cannot*') {
                  throw 'An available Block switch has an unavailable tooltip.'
              }
              [UcrWindowCapture]::MovePointerAway()
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-binding-controls-restored.png')) | Out-Null
              $outputOptions.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $watch = [Diagnostics.Stopwatch]::StartNew()
              (Find-UcrElement $nameProperty 'Choose output control').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $key = Find-UcrElement $nameProperty 'J'
              Write-Host "Output chooser opened in $($watch.ElapsedMilliseconds)ms"
              $key.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 400
              Save-UcrIfNeeded
              $saved = Read-UcrState
              $profile = @($saved.profiles | Where-Object title -eq 'Binding controls')[0]
              $output = $profile.mappings[0].plugins[0].data.outputs[0]
              if (-not $output.isBound -or $output.keyValue -ne 3 -or $output.assignedControlName -ne 'J') {
                  throw 'Choose output control did not open a keyboard picker and save the chosen key.'
              }
              Write-Host 'PASS Output ellipsis Choose output control opens the explicit keyboard picker and saves J'
              $outputBind = @(Get-UcrControls 'BindButton' | Where-Object { -not $_.Current.IsOffscreen } |
                  Sort-Object { $_.Current.BoundingRectangle.Left })[-1]
              $outputBind.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('+{F10}')
              (Find-UcrElement $nameProperty 'Choose output control').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Find-UcrElement $nameProperty 'Shift' | Out-Null
              [UcrWindowCapture]::MovePointerAway()
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-explicit-keyboard-output-picker.png')) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS The output context-menu entry opens the same explicit chooser'



          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath (Join-Path $directory 'capture-error.txt')
              Get-ChildItem -LiteralPath $dataRoot -Recurse -ErrorAction SilentlyContinue |
                  Select-Object FullName,Length,LastWriteTime | Out-String -Width 300 |
                  Set-Content -LiteralPath (Join-Path $directory 'fixture-files.txt')
              try { [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-audit-failure.png')) | Out-Null } catch {}
              Write-Error $_
              throw
          }
          finally {
              if ($null -ne $process) {
                  try { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } } catch {}
              }
          }

      - name: Upload UCR visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Visual-Audit
          path: ${{ runner.temp }}/UCR-Visual-Audit/
          if-no-files-found: warn

      - name: Verify quick output capture and saved device replacements
        if: ${{ !cancelled() && steps.visual_audit.outcome != 'skipped' }}
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'FunctionalBatch.cs'
          @'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Windows;
          using System.Windows.Threading;
          using System.Threading;
          using System.Threading.Tasks;
          using HidWizards.IOWrapper.DataTransferObjects;
          using HidWizards.IOWrapper.ProviderInterface.Interfaces;
          using HidWizards.UCR.Core;
          using HidWizards.UCR.Core.Managers;
          using HidWizards.UCR.Core.Models;
          using HidWizards.UCR.Core.Models.Binding;
          using HidWizards.UCR.Plugins.Remapper;
          using HidWizards.UCR.ViewModels.Dialogs;
          using HidWizards.UCR.ViewModels.ProfileViewModels;
          using HidWizards.UCR.ViewModels.Presentation;

          internal sealed class FunctionalKeyboard : IInputProvider, IBindModeProvider, IOutputProvider
          {
              public string ProviderName { get { return "FunctionalKeyboard"; } }
              public bool IsLive { get { return true; } }
              public void RefreshLiveState() { }
              public void RefreshDevices() { }
              public void Dispose() { }
              public int OutputProbes;
              public bool SubscribeOutputDevice(OutputSubscriptionRequest request) { return true; }
              public bool UnSubscribeOutputDevice(OutputSubscriptionRequest request) { return true; }
              public bool SetOutputState(OutputSubscriptionRequest request, BindingDescriptor binding, int state) { return true; }
              public DeviceReport GetOutputDeviceReport(DeviceDescriptor descriptor)
              {
                  DeviceReport device = GetInputDeviceReport(descriptor);
                  for (int i = 1; i < 200; i++) device.Nodes[0].Bindings.Add(new BindingReport {
                      Title = "Key " + i, Category = BindingCategory.Momentary,
                      BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = i } });
                  return device;
              }
              public ProviderReport GetOutputList()
              {
                  OutputProbes++;
                  ProviderReport report = new ProviderReport { Title = ProviderName, API = "Fixture",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName } };
                  report.Devices.Add(GetOutputDeviceReport(default(DeviceDescriptor))); return report;
              }
              public DetectionMode Mode { get; private set; }
              public void SetDetectionMode(DetectionMode mode, DeviceDescriptor device,
                  Action<ProviderDescriptor, DeviceDescriptor, BindingReport, short> callback = null) { Mode = mode; }
              public bool SubscribeInput(InputSubscriptionRequest request) { return true; }
              public bool UnsubscribeInput(InputSubscriptionRequest request) { return true; }
              public DeviceReport GetInputDeviceReport(DeviceDescriptor descriptor)
              {
                  DeviceReport device = new DeviceReport {
                      DeviceName = "K: Functional input", DeviceDescriptor = new DeviceDescriptor {
                          DeviceHandle = "Keyboard_FunctionalInput", DeviceInstance = 0 } };
                  DeviceReportNode keys = new DeviceReportNode { Title = "Keys" };
                  keys.Bindings.Add(new BindingReport { Title = "F", Category = BindingCategory.Momentary,
                      BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = 0 } });
                  device.Nodes.Add(keys); return device;
              }
              public ProviderReport GetInputList()
              {
                  ProviderReport report = new ProviderReport { Title = ProviderName, API = "Fixture",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName } };
                  report.Devices.Add(GetInputDeviceReport(default(DeviceDescriptor))); return report;
              }
          }

          internal static class FunctionalBatch
          {
              private static int checks;
              private static void Check(bool condition, string message)
              {
                  if (!condition) throw new InvalidOperationException(message);
                  Console.WriteLine("PASS " + message); checks++;
              }
              [STAThread]
              public static int Main()
              {
                  AppDomain.CurrentDomain.AssemblyResolve += delegate(object sender, ResolveEventArgs args) {
                      string file = new AssemblyName(args.Name).Name + ".dll";
                      foreach (string path in new[] { Path.Combine("lib", file), Path.Combine("Plugins", "UCR.Plugins", file) })
                          if (File.Exists(path)) return Assembly.LoadFrom(Path.GetFullPath(path));
                      return null;
                  };
                  try { return Run(); }
                  catch (Exception error) { Console.Error.WriteLine(error); return 1; }
              }
              private static DeviceBindingNode Node(string name, BindingType type, int index)
              {
                  return new DeviceBindingNode { Title = name, DeviceBindingInfo = new DeviceBindingInfo {
                      DeviceBindingCategory = type == BindingType.Axis ? DeviceBindingCategory.Range : DeviceBindingCategory.Momentary,
                      KeyType = (int)type, KeyValue = index, KeySubValue = 0 } };
              }
              private static Device Cached(string title, string provider, string handle, List<DeviceBindingNode> menu)
              {
                  return new Device(new DeviceCache { Title = title, ProviderName = provider,
                      DeviceHandle = handle, DeviceNumber = 0, DeviceBindingMenu = menu });
              }
              private static Profile MakeProfile(Context context, string title, Device output)
              {
                  Profile profile = context.ProfilesManager.CreateProfile(title, null, null);
                  profile.AddDeviceConfigurations(new List<DeviceConfiguration> { new DeviceConfiguration(output) }, DeviceIoType.Output);
                  context.ProfilesManager.AddProfile(profile);
                  return profile;
              }
              private static Mapping AddRoute(Profile profile, string name, Plugin plugin)
              {
                  Mapping mapping = profile.AddMapping(name);
                  if (!mapping.AddPlugin(plugin)) throw new InvalidOperationException("Could not create route");
                  mapping.InputRepresentation = 3; mapping.OutputRepresentation = plugin is ButtonToAxis ? 2 : 3;
                  mapping.DirectionalCapacity = 1; mapping.UseInputExpression = true;
                  mapping.DeviceBindings[0].InputExpressionInputKind = 0;
                  mapping.DeviceBindings[0].InputExpressionKindConfigured = true;
                  return mapping;
              }
              private static BindingVisualDescriptor Descriptor(MappingViewModel mapping)
              {
                  DeviceBinding binding = mapping.Plugins[0].DeviceBindings[0].DeviceBinding;
                  return new BindingVisualDescriptor { BindingGuid = binding.Guid, DeviceConfigurationGuid = binding.DeviceConfigurationGuid };
              }
              private static bool ApplyDetected(MappingViewModel mapping, DeviceConfiguration output, DetectedInputControl detected)
              {
                  MethodInfo apply = typeof(MappingViewModel).GetMethod("ApplyDetectedOutputControl", BindingFlags.Instance | BindingFlags.NonPublic);
                  return (bool)apply.Invoke(mapping, new object[] { mapping.Plugins[0].DeviceBindings[0], output, detected });
              }
              private static void Bind(DeviceBinding binding, DeviceConfiguration device, BindingType type, int index, string name)
              {
                  binding.SetDeviceConfigurationGuid(device.Guid);
                  binding.SetKeyTypeValue((int)type, index, 0, name);
              }
              private static void Pump(Task task)
              {
                  DispatcherFrame frame = new DispatcherFrame();
                  DateTime deadline = DateTime.UtcNow.AddSeconds(8);
                  DispatcherTimer timer = new DispatcherTimer();
                  timer.Interval = TimeSpan.FromMilliseconds(20);
                  timer.Tick += delegate {
                      if (task.IsCompleted || DateTime.UtcNow > deadline) frame.Continue = false;
                  };
                  timer.Start(); Dispatcher.PushFrame(frame); timer.Stop();
                  if (!task.IsCompleted) throw new TimeoutException("Capture did not complete after cancellation");
                  task.GetAwaiter().GetResult();
              }
              private static int Run()
              {
                  new Application();
                  SynchronizationContext.SetSynchronizationContext(new DispatcherSynchronizationContext());
                  using (Context context = new Context())
                  {
                      const BindingFlags hidden = BindingFlags.Instance | BindingFlags.NonPublic;
                      object controller = typeof(Context).GetProperty("IOController", hidden).GetValue(context, null);
                      IDictionary<string, IProvider> providers = (IDictionary<string, IProvider>)controller.GetType().GetField("_providers", hidden).GetValue(controller);
                      FunctionalKeyboard functionalInput = new FunctionalKeyboard();
                      providers.Add(functionalInput.ProviderName, functionalInput);
                      List<DeviceBindingNode> padMenu = new List<DeviceBindingNode> {
                          Node("LX", BindingType.Axis, 0), Node("LY", BindingType.Axis, 1),
                          Node("RX", BindingType.Axis, 2), Node("RY", BindingType.Axis, 3), Node("A", BindingType.Button, 0) };
                      Device pad = Cached("Fixture pad", "Core_vJoyInterfaceWrap", "pad-a", padMenu);
                      Profile profile = MakeProfile(context, "Quick directions", pad);
                      Mapping route = AddRoute(profile, "Quick direction", new ButtonToAxis());
                      using (ProfileViewModel vm = new ProfileViewModel(profile))
                      {
                          MappingViewModel mapping = vm.MappingsList[0];
                          List<QuickBindingOption> options = mapping.GetQuickOutputBindingOptions(Descriptor(mapping));
                          Check(options.Count(option => option.OutputAxisDirection != 0) == 8, "Collapsed picker offers all eight signed stick directions");
                          foreach (QuickBindingOption option in options.Where(option => option.OutputAxisDirection != 0))
                              Check(mapping.ApplyQuickOutputBinding(Descriptor(mapping), option), "Collapsed picker assigns " + option.DisplayName);
                          QuickBindingOption up = options.Single(option => option.DisplayName == "Left Stick Up");
                          Check(mapping.ApplyQuickOutputBinding(Descriptor(mapping), up), "Collapsed picker accepts a negative direction");
                          DeviceBinding binding = route.Plugins[0].Outputs[0];
                          Check(binding.AssignedControlName == "LY" && binding.OutputAxisDirection == -1 &&
                              ((ButtonToAxis)route.Plugins[0]).RangePressed == -100, "Signed quick selection retains the provider name and negative range");
                          QuickBindingOption full = options.Single(option => option.Title == "LY" && option.OutputAxisDirection == 0);
                          Check(mapping.ApplyQuickOutputBinding(Descriptor(mapping), full) && binding.OutputAxisDirection == 0 &&
                              ((ButtonToAxis)route.Plugins[0]).RangePressed == 100, "Full-axis quick rebinding clears direction and restores positive press");
                          mapping.Dispose();
                          Check(!mapping.ButtonsEnabled && !mapping.ApplyQuickOutputBinding(Descriptor(mapping), up), "A disposed mapping rejects stale picker assignments");
                      }

                      List<DeviceBindingNode> keys = new List<DeviceBindingNode> {
                          Node("Shared", BindingType.Button, 1), Node("Shared", BindingType.Button, 2), Node("F7", BindingType.Button, 3) };
                      Device keyboard = Cached("K: Fixture keyboard", "Core_Interception", "Keyboard_FunctionalOutput", keys);
                      Profile keyProfile = MakeProfile(context, "Keyboard selection", keyboard);
                      Mapping keyRoute = AddRoute(keyProfile, "Keyboard output", new ButtonToButton());
                      using (ProfileViewModel vm = new ProfileViewModel(keyProfile))
                      {
                          MappingViewModel mapping = vm.MappingsList[0];
                          Check(mapping.UsesPressCaptureForQuickOutput(Descriptor(mapping)), "An unset keyboard output uses press capture on its compatible primary");
                          BindingVisualDescriptor originalVisual = mapping.CollapsedOutputVisuals.Single();
                          Task<bool> captureTask = mapping.QuickBindOutputAsync(Descriptor(mapping));
                          DeviceBindingViewModel captureVm = mapping.Plugins[0].DeviceBindings[0];
                          Console.WriteLine("Capture state: completed=" + captureTask.IsCompleted + " detecting=" + mapping.IsQuickOutputDetecting +
                              " binding=" + captureVm.IsCapturing + " label=" + captureVm.BindButtonText + " progress=" + captureVm.PreviewValue +
                              " status=" + mapping.QuickOutputDetectionStatus);
                          Check(!captureTask.IsCompleted && mapping.IsQuickOutputDetecting && captureVm.IsCapturing &&
                              captureVm.BindButtonText.Contains("PRESS INPUT") && captureVm.PreviewValue > 0,
                              "Keyboard output capture exposes a listening label and countdown on the binding");
                          Check(object.ReferenceEquals(originalVisual, mapping.CollapsedOutputVisuals.Single()) &&
                              originalVisual.IsCapturing && originalVisual.ToolTip.StartsWith("LISTENING"),
                              "Output capture updates the existing collapsed glyph without destroying its focus target");
                          mapping.QuickBindOutputAsync(Descriptor(mapping)).GetAwaiter().GetResult();
                          Pump(captureTask);
                          Check(!mapping.IsQuickOutputDetecting && !captureVm.IsCapturing && !originalVisual.IsCapturing &&
                              functionalInput.Mode == DetectionMode.Subscription,
                              "Cancelling output capture restores the ordinary binding, collapsed glyph and provider subscription mode");
                          DeviceConfiguration output = keyProfile.OutputDeviceConfigurations[0];
                          DetectedInputControl exact = new DetectedInputControl { Device = keyboard, ControlTitle = "Shared",
                              BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = 2, SubIndex = 0 } };
                          Check(ApplyDetected(mapping, output, exact), "Keyboard capture resolves duplicate labels using the exact descriptor");
                          DeviceBinding saved = keyRoute.Plugins[0].Outputs[0];
                          Check(saved.KeyValue == 2 && saved.AssignedControlName == "Shared" && saved.DeviceConfigurationGuid == output.Guid,
                              "Keyboard capture saves the right key, original name and output device");
                          Device other = Cached("K: Other keyboard", "Core_Interception", "Keyboard_OtherInput", keys);
                          DetectedInputControl ambiguous = new DetectedInputControl { Device = other, ControlTitle = "Shared" };
                          Check(!ApplyDetected(mapping, output, ambiguous) && saved.KeyValue == 2,
                              "Ambiguous cross-device labels are rejected without changing the binding");
                          Check(ApplyDetected(mapping, output, new DetectedInputControl { Device = other, ControlTitle = "F7" }) &&
                              saved.KeyValue == 3 && saved.AssignedControlName == "F7", "Unambiguous keyboard capture preserves the selected key name");
                      }

                      Device replacement = Cached("Offline replacement", "Core_vJoyInterfaceWrap", "pad-b", padMenu);
                      Profile batch = MakeProfile(context, "Batch banks", pad);
                      DeviceConfiguration source = batch.OutputDeviceConfigurations[0];
                      DeviceConfiguration destination = new DeviceConfiguration(replacement);
                      batch.AddDeviceConfigurations(new List<DeviceConfiguration> { destination }, DeviceIoType.Output);
                      DeviceConfiguration sourceInput = new DeviceConfiguration(pad);
                      DeviceConfiguration destinationInput = new DeviceConfiguration(replacement);
                      batch.AddDeviceConfigurations(new List<DeviceConfiguration> { sourceInput, destinationInput }, DeviceIoType.Input);
                      Mapping bankRoute = AddRoute(batch, "Saved banks", new ButtonToAxis());
                      Bind(bankRoute.Plugins[0].Outputs[0], source, BindingType.Axis, 1, "LY");
                      Bind(bankRoute.DeviceBindings[0], sourceInput, BindingType.Button, 0, "A");
                      Plugin inactive = new ButtonToButton(); inactive.SetProfile(batch);
                      Bind(inactive.Outputs[0], source, BindingType.Button, 0, "A");
                      bankRoute.InactiveOutputRepresentations.Add(new DirectionalOutputBank {
                          Representation = 3, Plugins = new List<Plugin> { inactive } });
                      DeviceBinding inactiveInput = new DeviceBinding(null, batch, DeviceIoType.Input) {
                          DeviceBindingCategory = DeviceBindingCategory.Range, InputExpressionInputKind = 3,
                          InputExpressionKindConfigured = true };
                      Bind(inactiveInput, sourceInput, BindingType.Axis, 0, "LX");
                      bankRoute.InactiveInputRepresentations.Add(new DirectionalInputBank {
                          Representation = 2, GroupIndex = 0, Bindings = new List<DeviceBinding> { inactiveInput } });
                      MappingGroup untouched = new MappingGroup(batch, "Untouched"); batch.MappingGroups.Add(untouched);
                      Mapping outside = untouched.AddMapping("Not selected"); outside.AddPlugin(new ButtonToButton());
                      Bind(outside.Plugins[0].Outputs[0], source, BindingType.Button, 0, "A");
                      using (ProfileViewModel vm = new ProfileViewModel(batch))
                      {
                          MappingGroupViewModel main = vm.MappingSections.Single(section => section.Mappings.Any(mapping => mapping.Mapping == bankRoute));
                          BatchDeviceChangeDialogViewModel dialog = new BatchDeviceChangeDialogViewModel(vm);
                          dialog.SelectedSource = dialog.SourceDevices.Single(option => option.IoType == DeviceIoType.Output && option.Guid == source.Guid);
                          Check(dialog.SelectedSource.ReferenceCount == 3, "Batch source counts include saved inactive outputs");
                          Check(dialog.TargetDevices.Any(option => option.Guid == destination.Guid && !option.IsAvailable),
                              "Batch replacement offers configured offline destinations");
                          BatchDeviceChangeResult changed = vm.BatchChangeDevice(dialog.SelectedSource,
                              dialog.TargetDevices.Single(option => option.Guid == destination.Guid), new[] { main });
                          Check(changed.Changed == 2 && changed.ClearedAsIncompatible == 0 && changed.ClearedAsUnverified == 0,
                              "Batch replacement transfers compatible active and inactive output bindings");
                          Check(bankRoute.Plugins[0].Outputs[0].DeviceConfigurationGuid == destination.Guid &&
                              inactive.Outputs[0].DeviceConfigurationGuid == destination.Guid && inactive.Outputs[0].IsBound,
                              "Inactive output assignments keep the replacement and their physical controls");
                          Check(outside.Plugins[0].Outputs[0].DeviceConfigurationGuid == source.Guid,
                              "Batch replacement leaves unselected mapping groups unchanged");
                          changed = vm.BatchChangeDevice(new BatchDeviceOption { IoType = DeviceIoType.Input, Guid = sourceInput.Guid },
                              new BatchDeviceOption { IoType = DeviceIoType.Input, Guid = destinationInput.Guid }, new[] { main });
                          Check(changed.Changed == 2 && inactiveInput.DeviceConfigurationGuid == destinationInput.Guid && inactiveInput.IsBound,
                              "Batch replacement also migrates saved inactive input bindings");
                          MappingViewModel restoredMapping = vm.MappingsList.Single(item => item.Mapping == bankRoute);
                          Check(restoredMapping.SetOutputRepresentation(3) && bankRoute.Plugins[0].Outputs[0].DeviceConfigurationGuid == destination.Guid &&
                              bankRoute.Plugins[0].Outputs[0].IsBound,
                              "Switching back to a saved output representation retains the replacement device");
                      }

                      Device outputKeyboard = context.DevicesManager.GetAvailableDeviceList(DeviceIoType.Output, false)
                          .Single(device => device.ProviderName == "FunctionalKeyboard");
                      Profile performance = MakeProfile(context, "Picker enumeration", outputKeyboard);
                      Mapping performanceRoute = AddRoute(performance, "Many keys", new ButtonToButton());
                      performanceRoute.Plugins[0].Outputs[0].SetDeviceConfigurationGuid(performance.OutputDeviceConfigurations[0].Guid);
                      using (ProfileViewModel vm = new ProfileViewModel(performance))
                      {
                          int before = functionalInput.OutputProbes;
                          List<QuickBindingOption> options = vm.MappingsList[0].GetQuickOutputBindingOptions(Descriptor(vm.MappingsList[0]));
                          Check(options.Count == 200 && functionalInput.OutputProbes - before <= 3,
                              "A 200-key picker enumerates output devices once instead of once per tile");
                      }
                      Profile blockProfile = new Profile(context);
                      DeviceBindingNode blockKey = Node("F", BindingType.Button, 0); blockKey.DeviceBindingInfo.Blockable = true;
                      DeviceConfiguration blockDevice = new DeviceConfiguration(Cached("K: Block test", "Core_Interception", "Keyboard_Block", new List<DeviceBindingNode> { blockKey }));
                      blockProfile.AddDeviceConfigurations(new List<DeviceConfiguration> { blockDevice }, DeviceIoType.Input);
                      DeviceBinding blockBinding = new DeviceBinding(null, blockProfile, DeviceIoType.Input) { DeviceBindingCategory = DeviceBindingCategory.Momentary };
                      blockBinding.SetDeviceConfigurationGuid(blockDevice.Guid);
                      using (DeviceBindingViewModel blockVm = new DeviceBindingViewModel(blockBinding) { DeviceBindingCategory = DeviceBindingCategory.Momentary })
                      {
                          int tooltipChanges = 0;
                          blockVm.PropertyChanged += delegate(object sender, System.ComponentModel.PropertyChangedEventArgs e) {
                              if (e.PropertyName == "BlockAvailability") tooltipChanges++;
                          };
                          Check(blockVm.ShowBlock == Visibility.Collapsed, "Unbound inputs retain conditional Block visibility");
                          Bind(blockBinding, blockDevice, BindingType.Button, 0, "F");
                          Check(blockVm.ShowBlock == Visibility.Visible && blockVm.CanBlock && tooltipChanges > 0 &&
                              blockVm.BlockAvailability.StartsWith("Block this"), "Binding a blockable key updates its tooltip with the visible switch");
                          tooltipChanges = 0;
                          blockBinding.ClearBinding();
                          Check(blockVm.ShowBlock == Visibility.Collapsed && tooltipChanges > 0 && blockVm.BlockAvailability.Contains("cannot"),
                              "Clearing a key updates both conditional Block visibility and its tooltip");
                      }
                      Device liveKeyboard = context.DevicesManager.GetAvailableDeviceList(DeviceIoType.Input, false)
                          .First(device => device.ProviderName == "FunctionalKeyboard" && device.DeviceHandle == "Keyboard_FunctionalInput");
                      Profile capture = MakeProfile(context, "Capture removal", pad);
                      DeviceConfiguration liveInput = new DeviceConfiguration(liveKeyboard);
                      capture.AddDeviceConfigurations(new List<DeviceConfiguration> { liveInput }, DeviceIoType.Input);
                      Mapping captureRoute = AddRoute(capture, "Remove while capturing", new ButtonToButton());
                      DeviceBinding inputBinding = captureRoute.DeviceBindings[0];
                      inputBinding.SetDeviceConfigurationGuid(liveInput.Guid);
                      DeviceBindingViewModel inputVm = new DeviceBindingViewModel(inputBinding) { DeviceBindingCategory = DeviceBindingCategory.Momentary };
                      inputBinding.EnterBindMode();
                      inputBinding.SetDeviceConfigurationGuid(Guid.Empty, false);
                      Check(!context.BindingManager.IsBindModeActive && !inputBinding.IsInBindMode && inputBinding.DeviceConfigurationGuid == Guid.Empty,
                          "Manually changing the input device cancels the previous detector");
                      inputBinding.SetDeviceConfigurationGuid(liveInput.Guid);
                      inputBinding.EnterBindMode();
                      inputBinding.ClearBinding();
                      Check(!context.BindingManager.IsBindModeActive && !inputBinding.IsInBindMode && !inputBinding.IsBound,
                          "Clearing a waiting input ends capture instead of allowing a late press to refill it");
                      inputBinding.SetDeviceConfigurationGuid(liveInput.Guid);
                      inputBinding.EnterBindMode();
                      inputBinding.SetInputExpressionInputKind(3);
                      Check(!context.BindingManager.IsBindModeActive && !inputBinding.IsInBindMode,
                          "Switching an input capture from Button to Axis cancels the previous detector");
                      inputBinding.SetInputExpressionInputKind(0);
                      inputBinding.EnterBindMode();
                      Check(context.BindingManager.IsBindModeActive && inputBinding.IsInBindMode, "The provider capture is active before removing its editor slot");
                      inputVm.Dispose();
                      Check(!context.BindingManager.IsBindModeActive && !inputBinding.IsInBindMode && !inputVm.BindingEnabled,
                          "Removing a binding editor cancels provider capture and disables stale actions");
                  }
                  Console.WriteLine("Functional batch passed " + checks + " checks.");
                  return 0;
              }
          }
          '@ | Set-Content -LiteralPath $source -Encoding UTF8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $wpf = Join-Path $framework 'WPF'
          $refs = @('.\release\UCR.exe', '.\release\lib\UCR.Core.dll', '.\release\Plugins\UCR.Plugins\UCR.Plugins.dll',
                    '.\release\lib\IOWrapper.DTOs.dll', '.\release\lib\IOWrapper.IProvider.dll',
                    (Join-Path $wpf 'PresentationFramework.dll'), (Join-Path $wpf 'PresentationCore.dll'),
                    (Join-Path $wpf 'WindowsBase.dll'), 'System.Xaml.dll', 'System.Core.dll', 'Microsoft.CSharp.dll')
          $compileArguments = @('/nologo', '/target:exe', '/out:.\release\UCR.Tests.exe') + @($refs | ForEach-Object { '/r:' + $_ }) + @($source)
          & $csc @compileArguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the functional batch verifier.' }
          Copy-Item '.\release\UCR.exe.config' '.\release\UCR.Tests.exe.config'
          Push-Location '.\release'
          try {
              & '.\UCR.Tests.exe'
              if ($LASTEXITCODE -ne 0) { throw 'Functional batch verification failed.' }
          } finally { Pop-Location }
