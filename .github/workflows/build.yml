              public static int SetDesktopScale(int percent) {
                  const uint activePaths = 2;
                  uint count, modeCount;
                  CheckDisplayResult("Enumerate active display paths", GetDisplayConfigBufferSizes(activePaths, out count, out modeCount));
                  if (count != 1) throw new Exception("Expected a single active display path, got " + count);
                  // DISPLAYCONFIG_PATH_INFO begins with the source LUID and ID.
                  var paths = Marshal.AllocHGlobal(checked((int)count * 72));
                  var modes = Marshal.AllocHGlobal(checked((int)modeCount * 64));
                  try {
                      CheckDisplayResult("Read active display paths", QueryDisplayConfig(activePaths, ref count, paths, ref modeCount, modes, IntPtr.Zero));
                      var source = (Source)Marshal.PtrToStructure(paths, typeof(Source));
                      var range = new ScaleRange { Header = new DisplayRequest { Type = -3, Size = 32, Source = source } };
                      CheckDisplayResult("Read display scaling range", DisplayConfigGetDeviceInfo(ref range));
                      var values = new[] { 100, 125, 150, 175, 200, 225, 250, 300, 350, 400, 450, 500 };
                      var prior = values[range.Current - range.Minimum];
                      var position = Array.IndexOf(values, percent) + range.Minimum;
                      if (position < range.Minimum || position > range.Maximum)
                          throw new Exception("The active display does not support scale " + percent);
                      if (position != range.Current) {
                          var change = new ScaleChange {
                              Header = new DisplayRequest { Type = -4, Size = 24, Source = source }, Position = position
                          };
                          CheckDisplayResult("Set display scaling", DisplayConfigSetDeviceInfo(ref change));
                          CheckDisplayResult("Read back display scaling", DisplayConfigGetDeviceInfo(ref range));
                          if (range.Current != position) throw new Exception("Windows did not apply scale " + percent);
