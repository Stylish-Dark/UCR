                  if ($bounds.Left -lt $frame.Left -or $bounds.Right -gt $frame.Right -or
                      $bounds.Top -lt $frame.Top -or $bounds.Bottom -gt $frame.Bottom) {
                      throw "Picker control '$label' is outside the short window: $bounds, window $frame."
                  }
              }
              Write-Host 'PASS Output picker including Clear binding fits inside a short window'
              [UcrWindowCapture]::MovePointerAway()
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-output-picker-short-window.png')) | Out-Null
              $axisTile.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 300
              Save-UcrIfNeeded
              $saved = Get-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Raw -Encoding UTF8 | ConvertFrom-Json
              $profile = @($saved.profiles | Where-Object title -eq 'Blank axis output')[0]
              $output = $profile.mappings[0].plugins[0].data.outputs[0]
              if ($output.deviceConfigurationGuid -ne $controller -or $output.assignedControlName -ne 'LX' -or -not $output.isBound) {
                  throw 'The axis choice did not save to the compatible secondary controller.'
              }
              Write-Host 'PASS Blank axis picker selects and saves an axis on the compatible secondary device'

              Open-OutputPicker 'Blank button output'
              Find-UcrElement $nameProperty 'Primary A' | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS Blank button picker keeps the compatible primary device'

              Open-OutputPicker 'Explicit button-only output'
              Find-UcrElement $nameProperty 'Primary A' | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS Picker preserves an explicitly chosen output device'

              Open-OutputPicker 'Blank axis output'
              (Find-UcrElement $nameProperty 'Directions').GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              (Find-UcrElement $nameProperty 'Left Stick Up').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 400
              Save-UcrIfNeeded
              $saved = Get-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Raw -Encoding UTF8 | ConvertFrom-Json
              $profile = @($saved.profiles | Where-Object title -eq 'Blank axis output')[0]
              $output = $profile.mappings[0].plugins[0].data.outputs[0]
              if ($output.deviceConfigurationGuid -ne $controller -or $output.assignedControlName -ne 'LY' -or
                  $output.outputAxisDirection -ne -1 -or -not $output.isBound) {
                  throw "Signed stick output did not save: $($output | ConvertTo-Json -Compress)"
              }
              Write-Host 'PASS Signed stick output saves the original axis name and the negative direction'
              Open-OutputPicker 'Blank axis output'
              Find-UcrElement $nameProperty 'Left Stick Up' | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS Reopening a signed stick output starts in Directions'

              function Assert-FullAxisSaved([string]$pathLabel) {
                  Save-UcrIfNeeded
                  $saved = Get-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Raw -Encoding UTF8 | ConvertFrom-Json
                  $profile = @($saved.profiles | Where-Object title -eq 'Blank axis output')[0]
                  $data = $profile.mappings[0].plugins[0].data
                  $output = $data.outputs[0]
                  if ($output.deviceConfigurationGuid -ne $controller -or $output.assignedControlName -ne 'LY' -or
                      $output.outputAxisDirection -ne 0 -or $data.rangePressed -ne 100 -or -not $output.isBound) {
                      throw "$pathLabel did not clear the previous negative direction and restore the press range: $($data | ConvertTo-Json -Depth 10 -Compress)"
                  }
                  Write-Host "PASS $pathLabel restores the full axis and its ordinary press range"
              }

              Open-OutputPicker 'Blank axis output'
              (Find-UcrElement $nameProperty 'Axes').GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              (Find-UcrElement $nameProperty 'Left stick Y axis').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Assert-FullAxisSaved 'Expanded picker'

              Open-OutputPicker 'Blank axis output'
              (Find-UcrElement $nameProperty 'Directions').GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              (Find-UcrElement $nameProperty 'Left Stick Up').GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Invoke-UcrControl 'UiExpandMapping'
              Start-Sleep -Milliseconds 350
              [UcrWindowCapture]::MoveWindow($handle, 720, 120, 1320, 680, $true) | Out-Null
              Start-Sleep -Milliseconds 350
              (Find-UcrControl 'UiWorkspaceBindOutput').SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
              $quick = Find-UcrElement $nameProperty 'LY'
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
              $window = [UcrWindowCapture]::VisibleWindowBounds($handle)
              $quickBounds = $quick.Current.BoundingRectangle
              if ($quickBounds.Right -gt [Math]::Min($screen.Right, $window.Right) -or
                  $quickBounds.Left -lt [Math]::Max($screen.Left, $window.Left) -or
                  $quickBounds.Bottom -gt [Math]::Min($screen.Bottom, $window.Bottom)) {
                  throw "Quick output choice outside the visible editor: $quickBounds"
              }
              Write-Host 'PASS Collapsed quick output menu fits at the monitor edge'
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-quick-output-monitor-edge.png')) | Out-Null
              $quick.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Assert-FullAxisSaved 'Collapsed picker'

              [UcrWindowCapture]::MoveWindow($handle, 40, 70, 1320, 650, $true) | Out-Null
              Start-Sleep -Milliseconds 350
              Open-OutputPicker 'Blank axis output'
              Find-UcrElement $nameProperty 'Left stick Y axis' | Out-Null
              [UcrWindowCapture]::MoveWindow($handle, 80, 95, 1320, 650, $true) | Out-Null
              Start-Sleep -Milliseconds 450
              $afterMove = $null
              try { $afterMove = Find-UcrElement $nameProperty 'Left stick Y axis' } catch {}
              if ($null -ne $afterMove) { throw 'The old output picker remained open after moving the owner window.' }
              Open-OutputPicker 'Blank axis output'
              Find-UcrElement $nameProperty 'Left stick Y axis' | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Write-Host 'PASS Moving the editor dismisses the stale picker and it reopens at its new location'


              [UcrWindowCapture]::MoveWindow($handle, 720, 120, 1320, 680, $true) | Out-Null
              Start-Sleep -Milliseconds 450
              (Find-UcrElement $nameProperty '4-Way output').SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
              Invoke-UcrControl 'UiMappingCompoundOutputBind'
              $hat = Find-UcrElement $nameProperty 'D-pad 2 (Audit secondary controller)'
              $stick = Find-UcrElement $nameProperty 'Left stick (Audit virtual controller)'
              $workArea = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
              $frame = [UcrWindowCapture]::VisibleWindowBounds($handle)
              foreach ($item in @($hat, $stick)) {
                  $bounds = $item.Current.BoundingRectangle
                  if ($bounds.Left -lt [Math]::Max($frame.Left, $workArea.Left) -or
                      $bounds.Right -gt [Math]::Min($frame.Right, $workArea.Right) -or
                      $bounds.Top -lt [Math]::Max($frame.Top, $workArea.Top) -or
                      $bounds.Bottom -gt [Math]::Min($frame.Bottom, $workArea.Bottom)) {
                      throw "Four-way choice '$($item.Current.Name)' outside visible workspace: $bounds"
                  }
              }
              Write-Host 'PASS Four-way picker stays on-screen in a partially off-screen window'
              [UcrWindowCapture]::MovePointerAway()
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-four-way-picker-monitor-edge.png')) | Out-Null
              $hat.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Save-UcrIfNeeded
              $saved = Get-Content -LiteralPath (Join-Path $dataRoot 'state.json') -Raw -Encoding UTF8 | ConvertFrom-Json
              $profile = @($saved.profiles | Where-Object title -eq 'Blank axis output')[0]
              $channels = @($profile.mappings[0].plugins | ForEach-Object { $_.data.outputs })
              if ($channels.Count -ne 4 -or ($channels.keyValue -join ',') -ne '7,5,4,6' -or
                  @($channels | Where-Object { -not $_.isBound -or $_.deviceConfigurationGuid -ne $vjoy }).Count) {
                  throw 'Second-hat choice did not save all four directions to vJoy.'
              }
              Write-Host 'PASS All four directions save to the second vJoy hat from the edge-constrained picker'
          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath (Join-Path $directory 'capture-error.txt')
              try { [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-audit-failure.png')) | Out-Null } catch {}
              Write-Error $_
              throw
          }
          finally {
              if ($null -ne $process) {
                  try { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } } catch {}
              }
          }

      - name: Upload UCR visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Visual-Audit
          path: ${{ runner.temp }}/UCR-Visual-Audit/
          if-no-files-found: warn
