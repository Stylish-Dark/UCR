              foreach ($button in $directionButtons) {
                  $labels = $button.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new($nameProperty, 'Bind'))
                  if ($labels.Count) { throw 'An unassigned compass slot still displays Bind.' }
              }
              Select-UcrProfile 'Axis dead zone audit'
              Invoke-UcrControl 'UiExpandMapping'
              Find-UcrControl 'UiMappingInputHeading' | Out-Null
              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 900, $true) | Out-Null
              Start-Sleep -Milliseconds 650
              [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-axis-1200.png')) | Out-Null
              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1600, 1000, $true) | Out-Null
              Start-Sleep -Milliseconds 650
              [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-axis-1600.png')) | Out-Null
              Write-Host 'Verified compass placeholders and captured the mapping editor at 1200 and 1600 pixels.'

              [UcrWindowCapture]::MoveWindow($handle, 0, 0, 1200, 900, $true) | Out-Null
              Invoke-UcrControl 'AppearanceButton'
              $swatches = @(Get-UcrControls 'UiAccentSwatch' | Where-Object { -not $_.Current.IsOffscreen })
              if ($swatches.Count -ne 6) { throw "Expected six visible appearance swatches; got $($swatches.Count)." }
              $swatchBounds = @($swatches | ForEach-Object { $_.Current.BoundingRectangle } | Sort-Object X)
              for ($i = 1; $i -lt $swatchBounds.Count; $i++) {
                  if ($swatchBounds[$i].Left -lt $swatchBounds[$i-1].Right) { throw 'Appearance swatch hit targets overlap.' }
              }
              [UcrWindowCapture]::MovePointerAway()
              Start-Sleep -Milliseconds 500
              [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-appearance.png')) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              Start-Sleep -Milliseconds 300
              Invoke-UcrControl 'UiToolbarImportExport'
              Find-UcrControl 'UiImport' | Out-Null
              Find-UcrControl 'UiExport' | Out-Null
              Start-Sleep -Milliseconds 400
              [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-import-export.png')) | Out-Null
              Invoke-UcrControl 'UiCancel'
              Invoke-UcrControl 'UiToolbarDevices'
              Find-UcrControl 'UiDeviceBack' | Out-Null
              Start-Sleep -Milliseconds 500
              [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-device-manager.png')) | Out-Null
              Invoke-UcrControl 'UiDeviceBack'
              Write-Host 'Verified six non-overlapping appearance targets and captured appearance, import/export, devices and output selection.'













          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath (Join-Path $directory 'capture-error.txt')
              Write-Error $_
              throw
          }
          finally {
              if ($null -ne $process) {
                  try { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } } catch {}
              }
          }

      - name: Upload UCR visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Visual-Audit
          path: ${{ runner.temp }}/UCR-Visual-Audit/
          if-no-files-found: warn

