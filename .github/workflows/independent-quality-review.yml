name: Independent UCR Quality Review

on:
  workflow_run:
    workflows: ["Build UCR Stylish"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  independent-review:
    name: Independent design and functional QA
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Download actual WPF screenshots from exact Windows run
        uses: actions/download-artifact@v4
        with:
          name: UCR-Directional-UI-Preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-screenshots
      - name: Prepare evidence and source diff
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          WINDOWS_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show --format=fuller --no-ext-diff --stat --no-patch HEAD > qa-diff.txt
          git show --format= --no-ext-diff --find-renames HEAD >> qa-diff.txt
          python3 - <<'PY'
          import os, json
          metadata = {
              'source_sha': os.environ['EXPECTED_SHA'],
              'windows_build_run_id': os.environ['WINDOWS_BUILD_RUN_ID'],
              'windows_build_conclusion': 'success',
          }
          with open('qa-build.json', 'w', encoding='utf-8') as f:
              json.dump(metadata, f, indent=2)
          PY
      - name: Independent AI review — fail closed
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UCR_DESIGN_REVIEW_MODEL: gpt-6.1-terra
          UCR_FUNCTION_REVIEW_MODEL: gpt-6.1-sol
        run: |
          python3 build/quality/independent_review.py \
            --screenshots qa-screenshots \
            --expected build/quality/expected_screenshots.txt \
            --constitution quality/DESIGN_CONSTITUTION.md \
            --diff qa-diff.txt \
            --metadata qa-build.json \
            --output qa-result
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UCR-Independent-Review
          path: qa-result/
          if-no-files-found: warn
      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ -f qa-result/review.md ]; then
            cat qa-result/review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Review could not run or produce a report. **NOT APPROVED.**' >> "$GITHUB_STEP_SUMMARY"
          fi
