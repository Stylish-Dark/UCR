name: Audit vJoy picker
on:
  push:
    branches: [master]
    paths: ['.github/workflows/vjoy-picker-audit.yml']
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download established Windows build
        uses: actions/download-artifact@v4
        with:
          name: UCR-Windows
          path: release
          github-token: ${{ github.token }}
          run-id: 45109561527
      - name: Capture UCR UI on Windows runner
        id: visual_audit
        continue-on-error: false
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'UCR-Visual-Audit'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $exe = (Resolve-Path '.\release\UCR.exe').Path
          $mockPath = Join-Path (Split-Path $exe) 'Providers\UcrAuditOutput'
          New-Item -ItemType Directory -Path $mockPath -Force | Out-Null
          $originalVJoy = Join-Path (Split-Path $exe) 'Providers\Core_vJoyInterfaceWrap'
          if (Test-Path -LiteralPath $originalVJoy) { Remove-Item -LiteralPath $originalVJoy -Recurse -Force }
          $originalKeyboardProvider = Join-Path (Split-Path $exe) 'Providers\Core_Interception'
          if (Test-Path -LiteralPath $originalKeyboardProvider) { Remove-Item -LiteralPath $originalKeyboardProvider -Recurse -Force }
          $mockSource = Join-Path $env:RUNNER_TEMP 'UcrAuditOutput.cs'
          @'
          using System.ComponentModel.Composition;
          using HidWizards.IOWrapper.DataTransferObjects;
          using HidWizards.IOWrapper.ProviderInterface.Interfaces;
          [Export(typeof(IProvider))]
          public class UcrAuditOutput : IOutputProvider
          {
              public virtual string ProviderName { get { return "UcrAuditOutput"; } }
              public bool IsLive { get { return true; } }
              public void RefreshLiveState() { }
              public void RefreshDevices() { }
              public void Dispose() { }
              public bool SubscribeOutputDevice(OutputSubscriptionRequest request) { return true; }
              public bool UnSubscribeOutputDevice(OutputSubscriptionRequest request) { return true; }
              public bool SetOutputState(OutputSubscriptionRequest request, BindingDescriptor binding, int state) { return true; }
              public DeviceReport GetOutputDeviceReport(DeviceDescriptor descriptor)
              {
                  var device = new DeviceReport {
                      DeviceName = "Audit virtual controller",
                      DeviceDescriptor = new DeviceDescriptor { DeviceHandle = "audit", DeviceInstance = 0 }
                  };
                  var node = new DeviceReportNode { Title = "Buttons" };
                  for (var i = 0; i < 4; i++)
                      node.Bindings.Add(new BindingReport {
                          Title = "Audit " + (char)('A' + i), Category = BindingCategory.Momentary,
                          BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = i }
                      });
                  device.Nodes.Add(node);
                  var dpad = new DeviceReportNode { Title = "DPad" };
                  for (var i = 0; i < 4; i++)
                      dpad.Bindings.Add(new BindingReport {
                          Title = new[] { "Up", "Right", "Down", "Left" }[i], Category = BindingCategory.Momentary,
                          BindingDescriptor = new BindingDescriptor { Type = BindingType.POV, Index = i, SubIndex = 0 }
                      });
                  device.Nodes.Add(dpad);
                  var axes = new DeviceReportNode { Title = "Axes" };
                  foreach (var axis in new[] { "LX", "LY", "LT", "RT" })
                      axes.Bindings.Add(new BindingReport {
                          Title = axis, Category = BindingCategory.Signed,
                          BindingDescriptor = new BindingDescriptor {
                              Type = BindingType.Axis, Index = System.Array.IndexOf(new[] { "LX", "LY", "LT", "RT" }, axis)
                          }
                      });
                  device.Nodes.Add(axes);
                  return device;
              }
              public virtual ProviderReport GetOutputList()
              {
                  var report = new ProviderReport {
                      Title = ProviderName, API = "Audit",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName }
                  };
                  var state = System.IO.Path.Combine(System.Environment.GetEnvironmentVariable("RUNNER_TEMP"),
                      "ucr-output-fixture-state.txt");
                  var mode = System.IO.File.Exists(state) ? System.IO.File.ReadAllText(state).Trim() : "";
                  if (mode != "disconnected") {
                      var device = GetOutputDeviceReport(default(DeviceDescriptor));
                      if (mode == "reconnected") device.Nodes[0].Bindings[0].Title = "Reconnected A";
                      report.Devices.Add(device);
                  }
                  if (mode != "disconnected") {
                      var standby = GetOutputDeviceReport(default(DeviceDescriptor));
                      standby.DeviceName = "Audit standby controller";
                      standby.DeviceDescriptor = new DeviceDescriptor { DeviceHandle = "audit-standby", DeviceInstance = 0 };
                      report.Devices.Add(standby);
                  }
                  return report;
              }
          }
          [Export(typeof(IProvider))]
          public sealed class UcrAuditVJoy : UcrAuditOutput
          {
              public override string ProviderName { get { return "Core_vJoyInterfaceWrap"; } }
              public override ProviderReport GetOutputList() {
                  var report = new ProviderReport {
                      Title = ProviderName, API = "Audit",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName }
                  };
                  var secondary = GetOutputDeviceReport(default(DeviceDescriptor));
                  secondary.DeviceName = "Audit secondary controller";
                  secondary.DeviceDescriptor = new DeviceDescriptor { DeviceHandle = "audit-secondary", DeviceInstance = 0 };
                  secondary.Nodes[2].Bindings[2].Title = "RX";
                  secondary.Nodes[2].Bindings[3].Title = "RY";
                  var secondHat = new DeviceReportNode { Title = "Hat 2" };
                  for (var i = 0; i < 4; i++)
                      secondHat.Bindings.Add(new BindingReport {
                          Title = new[] { "Up", "Right", "Down", "Left" }[i],
                          Category = BindingCategory.Momentary,
                          BindingDescriptor = new BindingDescriptor { Type = BindingType.POV, Index = i + 4, SubIndex = 0 }
                      });
                  secondary.Nodes.Add(secondHat);
                  report.Devices.Add(secondary);
                  return report;
              }
          }
          [Export(typeof(IProvider))]
          public sealed class UcrAuditKeyboard : IInputProvider
          {
              public string ProviderName { get { return "Core_Interception"; } }
              public bool IsLive { get { return true; } }
              public void RefreshLiveState() { }
              public void RefreshDevices() { }
              public void Dispose() { }
              public bool SubscribeInput(InputSubscriptionRequest request) { return true; }
              public bool UnsubscribeInput(InputSubscriptionRequest request) { return true; }
              public DeviceReport GetInputDeviceReport(DeviceDescriptor descriptor)
              {
                  var device = new DeviceReport {
                      DeviceName = "K: Audit keyboard",
                      DeviceDescriptor = new DeviceDescriptor { DeviceHandle = "Keyboard_Audit", DeviceInstance = 0 }
                  };
                  var node = new DeviceReportNode { Title = "Keys" };
                  var keys = new[] { "F", "K", "U", "J" };
                  for (var i = 0; i < keys.Length; i++)
                      node.Bindings.Add(new BindingReport {
                          Title = keys[i], Category = BindingCategory.Momentary, Blockable = true,
                          BindingDescriptor = new BindingDescriptor { Type = BindingType.Button, Index = i }
                      });
                  device.Nodes.Add(node);
                  return device;
              }
              public ProviderReport GetInputList()
              {
                  var report = new ProviderReport {
                      Title = ProviderName, API = "Audit",
                      ProviderDescriptor = new ProviderDescriptor { ProviderName = ProviderName }
                  };
                  report.Devices.Add(GetInputDeviceReport(default(DeviceDescriptor)));
                  return report;
              }
          }
          '@ | Set-Content -LiteralPath $mockSource -Encoding UTF8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $dto = (Resolve-Path '.\release\lib\IOWrapper.DTOs.dll').Path
          $provider = (Resolve-Path '.\release\lib\IOWrapper.IProvider.dll').Path
          & $csc /nologo /target:library /r:System.ComponentModel.Composition.dll "/r:$dto" "/r:$provider" "/out:$mockPath\UcrAuditOutput.dll" $mockSource
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the Windows audit output fixture.' }


          # Runner-only saved DualSense binding fixture. No simulated hardware
          # signal is claimed; this exercises the actual app's persisted glyph.
          $dataRoot = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'UCR'
          $profileFolder = Join-Path $dataRoot 'Profiles'
          New-Item -ItemType Directory -Path $profileFolder -Force | Out-Null
          $profileId = [guid]::NewGuid().ToString('D')
          $deviceId = [guid]::NewGuid().ToString('D')
          $testProfile = @{
            guid = $profileId
            title = 'DualSense button verification'
            childProfiles = @()
            mappings = @(
              @{
                title = 'Cross to A'
                deviceBindings = @(
                  @{
                    isBound = $true
                    deviceConfigurationGuid = $deviceId
                    keyType = 1
                    keyValue = 49
                    keySubValue = 0
                  }
                )
                plugins = @(
                  @{
                    pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
                    data = @{
                      outputs = @()
                      filters = @()
                    }
                  }
                )
              }
            )
            mappingGroups = @()
            inputDeviceConfigurations = @(
              @{
                guid = $deviceId
                device = @{
                  title = 'DualSense Wireless Controller'
                  providerName = 'SharpDX_DirectInput'
                  deviceHandle = 'UCR_DUALSENSE_VISUAL_AUDIT'
                  deviceNumber = 0
                  hidPath = 'HID\VID_054C&PID_0CE6'
                }
                shadowDevices = @()
              }
            )
            outputDeviceConfigurations = @(
              @{
                guid = [guid]::NewGuid().ToString('D')
                device = @{
                  title = 'Xbox 360 Controller'
                  providerName = 'Core_ViGEm'
                  deviceHandle = 'xb360'
                  deviceNumber = 0
                }
                shadowDevices = @()
              }
            )
            autoActivateApplications = @()
          }
          $largeProfileId = [guid]::NewGuid().ToString('D')
          $largeProfile = $testProfile.Clone()
          $largeProfile.guid = $largeProfileId
          $largeProfile.title = 'Large-profile audit'
          $largeProfile.mappings = @(1..144 | ForEach-Object {
              $row = $testProfile.mappings[0].Clone()
              $row.title = 'Audit row ' + $_
              $row
          })
          @{ schemaVersion = 1; profile = $largeProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($largeProfileId + '.json')) -Encoding UTF8
          $triggerProfileId = [guid]::NewGuid().ToString('D')
          $triggerProfile = $testProfile.Clone()
          $triggerProfile.guid = $triggerProfileId
          $triggerProfile.title = 'Legacy trigger audit'
          $outputId = $triggerProfile.outputDeviceConfigurations[0].guid
          $triggerProfile.mappings = @(
              @{
                  title = 'LT to RT'
                  deviceBindings = @(@{
                      isBound = $true
                      deviceConfigurationGuid = $deviceId
                      keyType = 0
                      keyValue = 12
                      keySubValue = 0
                      inputExpressionInputKind = 3
                  })
                  plugins = @(@{
                      pluginType = 'HidWizards.UCR.Plugins.Remapper.AxisToAxis'
                      data = @{
                          outputs = @(@{
                              isBound = $true
                              deviceConfigurationGuid = $outputId
                              keyType = 0
                              keyValue = 5
                              keySubValue = 0
                          })
                          filters = @()
                          sensitivity = 71
                          deadZone = 13
                      }
                  })
              }
          )
          @{ schemaVersion = 1; profile = $triggerProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($triggerProfileId + '.json')) -Encoding UTF8
          $batchProfileId = [guid]::NewGuid().ToString('D')
          $batchOutputId = [guid]::NewGuid().ToString('D')
          $batchProfile = $testProfile.Clone()
          $batchProfile.guid = $batchProfileId
          $batchProfile.title = 'Populated batch audit'
          $batchProfile.primaryOutputDeviceConfigurationGuid = $batchOutputId
          $batchProfile.outputDeviceConfigurations = @(@{
              guid = $batchOutputId
              device = @{ title = 'Audit virtual controller'; providerName = 'UcrAuditOutput'; deviceHandle = 'audit'; deviceNumber = 0 }
              shadowDevices = @()
          })
          $batchRow = $testProfile.mappings[0].Clone()
          $batchRow.title = 'Three outputs'
          $batchRow.plugins = @(0..2 | ForEach-Object {
              @{
                  pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
                  data = @{
                      filters = @()
                      outputs = @(@{
                          guid = [guid]::NewGuid().ToString('D')
                          isBound = ($_ -eq 0)
                          deviceConfigurationGuid = $batchOutputId
                          keyType = 1
                          keyValue = 0
                          keySubValue = 0
                      })
                  }
              }
          })
          $lastBatchRow = $batchRow.Clone()
          $lastBatchRow.title = 'Another pending mapping'
          $lastBatchRow.plugins = @(@{
              pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
              data = @{ filters = @(); outputs = @(@{
                  guid = [guid]::NewGuid().ToString('D'); isBound = $false
                  deviceConfigurationGuid = $batchOutputId; keyType = 1; keyValue = 0; keySubValue = 0
              }) }
          })
          $batchProfile.mappings = @($batchRow, $lastBatchRow)
          @{ schemaVersion = 1; profile = $batchProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($batchProfileId + '.json')) -Encoding UTF8
          $dpadProfileId = [guid]::NewGuid().ToString('D')
          $dpadProfile = $testProfile.Clone()
          $dpadProfile.guid = $dpadProfileId
          $dpadProfile.title = 'Compound D-pad audit'
          $dpadProfile.mappings = @(@{
              title = 'D-pad to D-pad'
              inputRepresentation = 1
              compoundDigitalInput = $true
              outputRepresentation = 1
              directionalCapacity = 4
              compoundDigitalOutput = $true
              deviceBindings = @(1..4 | ForEach-Object {
                  @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true
                     deviceConfigurationGuid = $deviceId; keyType = 2; keyValue = 0; keySubValue = $_
                     assignedControlName = @('D-pad Left', 'D-pad Right', 'D-pad Up', 'D-pad Down')[$_ - 1]
                     inputDirectionSlot = $_ }
              })
              plugins = @(1..4 | ForEach-Object {
                  @{
                      pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
                      data = @{ filters = @(); outputs = @() }
                  }
              })
          })
          @{ schemaVersion = 1; profile = $dpadProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($dpadProfileId + '.json')) -Encoding UTF8
          $axisProfileId = [guid]::NewGuid().ToString('D')
          $axisProfile = $testProfile.Clone()
          $axisProfile.guid = $axisProfileId
          $axisProfile.title = 'Axis dead zone audit'
          $axisProfile.mappings = @(@{
              title = 'Axis to two buttons'
              inputRepresentation = 2; outputRepresentation = 3; directionalCapacity = 2
              useInputExpression = $true
              deviceBindings = @(@{
                  guid = [guid]::NewGuid().ToString('D'); isBound = $true
                  deviceConfigurationGuid = $deviceId; keyType = 0; keyValue = 1; keySubValue = 0
                  inputExpressionInputKind = 3; inputExpressionKindConfigured = $true
                  directionalButtonThreshold = 16384
              })
              plugins = @(1..2 | ForEach-Object {
                  @{ pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonToButton'
                     data = @{ filters = @(); outputs = @() } }
              })
          })
          @{ schemaVersion = 1; profile = $axisProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($axisProfileId + '.json')) -Encoding UTF8
          $presetProfileId = [guid]::NewGuid().ToString('D')
          $presetKeyboardId = [guid]::NewGuid().ToString('D')
          $presetProfile = $dpadProfile.Clone()
          $presetProfile.guid = $presetProfileId
          $presetProfile.title = 'Keyboard preset application audit'
          $presetProfile.inputDeviceConfigurations = @(@{
              guid = $presetKeyboardId
              device = @{ title = 'Audit keyboard'; providerName = 'UcrAuditKeyboard'; deviceHandle = 'keys'; deviceNumber = 0 }
              shadowDevices = @()
          })
          $presetProfile.primaryInputDeviceConfigurationGuid = $presetKeyboardId
          $presetProfile.compoundBindingPresets = @(@{ name = 'Audit custom cluster'; capacity = 4; keys = @('F','K','U','J') })
          $presetRow = $dpadProfile.mappings[0].Clone()
          $presetRow.title = 'Keyboard cluster to four outputs'
          $presetRow.deviceBindings = @(1..4 | ForEach-Object {
              @{ guid = [guid]::NewGuid().ToString('D'); isBound = $false; inputDirectionSlot = $_
                 deviceConfigurationGuid = $presetKeyboardId }
          })
          $presetProfile.mappings = @($presetRow)
          @{ schemaVersion = 1; profile = $presetProfile } |
            ConvertTo-Json -Depth 25 |
            Set-Content -LiteralPath (Join-Path $profileFolder ($presetProfileId + '.json')) -Encoding UTF8
          $matrixProfileIds = @()
          $auditProfiles = @()
          $keyboardConfig = [guid]::NewGuid().ToString('D')
          $secondaryOutputId = [guid]::NewGuid().ToString('D')
          foreach ($shape in @('single', 'paired', 'compound')) {
              $p = $testProfile.Clone()
              $p.guid = [guid]::NewGuid().ToString('D'); $matrixProfileIds += $p.guid
              $p.title = "Block $shape audit"
              if ($shape -eq 'single') {
                  $p.outputDeviceConfigurations = @(@{
                      guid = $p.outputDeviceConfigurations[0].guid
                      configurationName = 'Primary output'
                      device = @{ title = 'Audit virtual controller'; providerName = 'UcrAuditOutput'; deviceHandle = 'audit'; deviceNumber = 0 }
                      shadowDevices = @()
                  }, @{
                      guid = $secondaryOutputId
                      configurationName = 'Secondary output'
                      device = @{ title = 'Audit secondary controller'; providerName = 'Core_vJoyInterfaceWrap'; deviceHandle = 'audit-secondary'; deviceNumber = 0 }
                      shadowDevices = @()
                  })
                  $p.primaryOutputDeviceConfigurationGuid = $p.outputDeviceConfigurations[0].guid
              }
              $p.inputDeviceConfigurations = @(@{
                  guid = $keyboardConfig
                  device = @{ title = 'K: Audit keyboard'; providerName = 'Core_Interception'; deviceHandle = 'Keyboard_Audit'; deviceNumber = 0 }
                  shadowDevices = @()
              })
              $p.primaryInputDeviceConfigurationGuid = $keyboardConfig
              $capacity = if ($shape -eq 'single') { 1 } elseif ($shape -eq 'paired') { 2 } else { 4 }
              $p.mappings = @(@{
                  title = "Keyboard $shape mapping"; inputRepresentation = $(if ($capacity -eq 4) { 1 } else { 3 })
                  outputRepresentation = $(if ($capacity -eq 1) { 3 } elseif ($capacity -eq 2) { 2 } else { 1 })
                  directionalCapacity = $capacity; compoundDigitalInput = ($capacity -eq 4); useInputExpression = $true
                  deviceBindings = @(0..($capacity - 1) | ForEach-Object {
                      @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true; deviceConfigurationGuid = $keyboardConfig
                         keyType = 1; keyValue = $_; keySubValue = 0; assignedControlName = @('F','K','U','J')[$_]
                         inputExpressionKindConfigured = $true; inputDirectionSlot = $(if ($capacity -gt 1) { $_ + 1 } else { 0 }) }
                  })
                  plugins = @(0..([Math]::Max(1, $capacity / 2) - 1) | ForEach-Object {
                      @{ pluginType = $(if ($capacity -eq 1) { 'HidWizards.UCR.Plugins.Remapper.ButtonToButton' } else { 'HidWizards.UCR.Plugins.Remapper.AxisToAxis' })
                         data = @{ filters = @(); outputs = @(@{ guid = [guid]::NewGuid().ToString('D'); isBound = $true
                             deviceConfigurationGuid = $p.outputDeviceConfigurations[0].guid
                             keyType = $(if ($capacity -eq 1) { 1 } else { 0 }); keyValue = $_; keySubValue = 0 }) } }
                  })
              })
              $auditProfiles += $p
          }
          foreach ($type in @('Button','Axis')) {
              $p = $testProfile.Clone(); $p.guid = [guid]::NewGuid().ToString('D'); $matrixProfileIds += $p.guid
              $p.title = "$type Filter audit"
              $p.mappings = @(@{
                  title = "$type to named Filter"
                  deviceBindings = @(@{ guid = [guid]::NewGuid().ToString('D'); isBound = $true
                      deviceConfigurationGuid = $deviceId; keyType = $(if ($type -eq 'Axis') { 0 } else { 1 })
                      keyValue = $(if ($type -eq 'Axis') { 0 } else { 49 }); keySubValue = 0 })
                  plugins = @(@{ pluginType = "HidWizards.UCR.Plugins.Filter.$($type)ToFilter"
                      data = @{ filters = @(); outputs = @(); filterName = 'Audit scope filter'; rangeLowerBound = -35; rangeUpperBound = 65 } })
              })
              if ($type -eq 'Button') { $p.mappings[0].plugins[0].data.Remove('rangeLowerBound'); $p.mappings[0].plugins[0].data.Remove('rangeUpperBound') }
              $auditProfiles += $p
          }
          foreach ($type in @('ButtonToAxis','ButtonsToAxis','ButtonsToAxes','AxesToAxes')) {
              $p = $testProfile.Clone(); $p.guid = [guid]::NewGuid().ToString('D'); $matrixProfileIds += $p.guid
              $p.title = "Legacy $type audit"
              $inputCount = if ($type -eq 'ButtonsToAxis' -or $type -eq 'AxesToAxes') { 2 } elseif ($type -eq 'ButtonsToAxes') { 4 } else { 1 }
              $outputCount = if ($type -eq 'ButtonsToAxes' -or $type -eq 'AxesToAxes') { 2 } else { 1 }
              $p.mappings = @(@{
                  title = "Legacy $type mapping"
                  deviceBindings = @(0..($inputCount - 1) | ForEach-Object {
                      @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true; deviceConfigurationGuid = $deviceId
                         keyType = $(if ($type -eq 'AxesToAxes') { 0 } else { 1 })
                         keyValue = $(if ($type -eq 'AxesToAxes') { $_ * 4 } else { 49 + $_ }); keySubValue = 0 }
                  })
                  plugins = @(@{ pluginType = "HidWizards.UCR.Plugins.Remapper.$type"
                      data = @{ filters = @(); range = -35; rangePressed = 65; initialize = $true
                          outputs = @(0..($outputCount - 1) | ForEach-Object {
                              @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true
                                 deviceConfigurationGuid = $p.outputDeviceConfigurations[0].guid
                                 keyType = 0; keyValue = $_; keySubValue = 0 }
                          }) }
                  })
              })
              if ($type -ne 'ButtonToAxis') { $p.mappings[0].plugins[0].data.Remove('range'); $p.mappings[0].plugins[0].data.Remove('rangePressed'); $p.mappings[0].plugins[0].data.Remove('initialize') }
              if ($type -eq 'AxesToAxes') {
                  $p.mappings[0].plugins[0].data.sensitivity = 73
                  $p.mappings[0].plugins[0].data.deadZone = 17
                  $p.mappings[0].plugins[0].data.circularDz = $true
                  $p.mappings[0].plugins[0].data.invertX = $true
              }
              $auditProfiles += $p
          }
          $p = $testProfile.Clone(); $p.guid = [guid]::NewGuid().ToString('D'); $matrixProfileIds += $p.guid
          $p.title = 'Legacy keyboard four-way audit'
          $p.inputDeviceConfigurations = @(@{ guid = $keyboardConfig
              device = @{ title = 'K: Audit keyboard'; providerName = 'Core_Interception'; deviceHandle = 'Keyboard_Audit'; deviceNumber = 0 }; shadowDevices = @() })
          $p.primaryInputDeviceConfigurationGuid = $keyboardConfig
          $p.mappings = @(@{ title = 'Legacy keyboard four-way'
              deviceBindings = @(0..3 | ForEach-Object { @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true; deviceConfigurationGuid = $keyboardConfig
                  keyType = 1; keyValue = $_; keySubValue = 0; assignedControlName = @('F','K','U','J')[$_] } })
              plugins = @(@{ pluginType = 'HidWizards.UCR.Plugins.Remapper.ButtonsToAxes'
                  data = @{ filters = @(); outputs = @(0..1 | ForEach-Object { @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true
                      deviceConfigurationGuid = $p.outputDeviceConfigurations[0].guid; keyType = 0; keyValue = $_; keySubValue = 0 } }) } }) })
          $auditProfiles += $p
          foreach ($route in @('D-pad to D-pad','D-pad to two axes','D-pad to four buttons','Two axes to D-pad','Four buttons to D-pad')) {
              $p = $testProfile.Clone(); $p.guid = [guid]::NewGuid().ToString('D'); $matrixProfileIds += $p.guid
              $p.title = $route + ' audit'
              $axisInput = $route -eq 'Two axes to D-pad'
              $buttonInput = $route -eq 'Four buttons to D-pad'
              $axisOutput = $route -eq 'D-pad to two axes'
              $buttonOutput = $route -eq 'D-pad to four buttons'
              $inputCount = if ($axisInput) { 2 } else { 4 }
              $outputCount = if ($axisOutput) { 2 } else { 4 }
              $p.mappings = @(@{ title = $route
                  inputRepresentation = $(if ($axisInput) { 2 } elseif ($buttonInput) { 3 } else { 1 })
                  outputRepresentation = $(if ($axisOutput) { 2 } elseif ($buttonOutput) { 3 } else { 1 })
                  directionalCapacity = 4; compoundDigitalInput = (-not $axisInput -and -not $buttonInput)
                  compoundDigitalOutput = (-not $axisOutput -and -not $buttonOutput); useInputExpression = $true
                  deviceBindings = @(0..($inputCount - 1) | ForEach-Object {
                      @{ guid = [guid]::NewGuid().ToString('D'); isBound = $true; deviceConfigurationGuid = $deviceId
                          keyType = $(if ($axisInput) { 0 } elseif ($buttonInput) { 1 } else { 2 })
                          keyValue = $(if ($axisInput) { $_ * 4 } elseif ($buttonInput) { 49 + $_ } else { 0 })
                          keySubValue = $(if (-not $axisInput -and -not $buttonInput) { @(3,1,0,2)[$_] } else { 0 })
                          inputExpressionInputKind = $(if ($axisInput) { 3 } else { 0 })
                          inputExpressionKindConfigured = $true; inputDirectionSlot = $(if ($axisInput) { 0 } else { $_ + 1 }) }
                  })
                  plugins = @(0..($outputCount - 1) | ForEach-Object {
