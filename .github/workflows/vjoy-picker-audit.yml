          using System;
          using System.Collections.Generic;
          using System.Drawing;
          using System.Drawing.Imaging;
          using System.Runtime.InteropServices;
          public static class UcrWindowCapture {
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              private static extern bool GetWindowRect(IntPtr hwnd, out Rect rectangle);
              [DllImport("user32.dll")]
              private static extern bool PrintWindow(IntPtr hwnd, IntPtr dc, uint flags);
              [DllImport("user32.dll")]
              public static extern bool MoveWindow(IntPtr hwnd, int x, int y, int width, int height, bool repaint);
              [DllImport("user32.dll")]
              private static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")]
              private static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extra);

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              private struct DisplayMode {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string DeviceName;
                  public ushort SpecVersion, DriverVersion, Size, DriverExtra;
                  public uint Fields;
                  public int PositionX, PositionY;
                  public uint Orientation, FixedOutput;
                  public short Color, Duplex, YResolution, TTOption, Collate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string FormName;
                  public ushort LogPixels;
                  public uint BitsPerPel, Width, Height, Flags, Frequency;
                  public uint IcmMethod, IcmIntent, MediaType, DitherType, Reserved1, Reserved2, PanningWidth, PanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern bool EnumDisplaySettings(string deviceName, int mode, ref DisplayMode display);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int ChangeDisplaySettings(ref DisplayMode display, uint flags);
              [DllImport("dwmapi.dll")]
              private static extern int DwmGetWindowAttribute(IntPtr hwnd, int attribute, out Rect bounds, int size);
              public static Rectangle VisibleWindowBounds(IntPtr hwnd) {
                  Rect bounds;
                  if (DwmGetWindowAttribute(hwnd,9,out bounds,Marshal.SizeOf(typeof(Rect))) != 0)
                      GetWindowRect(hwnd,out bounds);
                  return Rectangle.FromLTRB(bounds.Left,bounds.Top,bounds.Right,bounds.Bottom);
              }
              [StructLayout(LayoutKind.Sequential)]
              private struct Source { public uint AdapterLow; public int AdapterHigh; public uint Id; }
              [StructLayout(LayoutKind.Sequential)]
              private struct DisplayRequest { public int Type; public uint Size; public Source Source; }
              [StructLayout(LayoutKind.Sequential)]
              private struct ScaleRange { public DisplayRequest Header; public int Minimum, Current, Maximum; }
              [StructLayout(LayoutKind.Sequential)]
              private struct ScaleChange { public DisplayRequest Header; public int Position; }
              [DllImport("user32.dll")]
              private static extern int GetDisplayConfigBufferSizes(uint flags, out uint paths, out uint modes);
              [DllImport("user32.dll")]
              private static extern int QueryDisplayConfig(uint flags, ref uint count, IntPtr paths, ref uint modeCount, IntPtr modes, IntPtr topology);
              [DllImport("user32.dll")]
              private static extern int DisplayConfigGetDeviceInfo(ref ScaleRange range);
              [DllImport("user32.dll")]
              private static extern int DisplayConfigSetDeviceInfo(ref ScaleChange change);
              [DllImport("user32.dll")]
              public static extern uint GetDpiForWindow(IntPtr hwnd);

              private static void CheckDisplayResult(string action, int result) {
                  if (result != 0) throw new Exception(action + " returned Win32 error " + result);
              }
              [DllImport("user32.dll")]
              private static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
              public static void CapturePhysicalWindow(IntPtr hwnd, string filename) {
                  var previous = SetThreadDpiAwarenessContext(new IntPtr(-4));
                  if (previous == IntPtr.Zero) throw new Exception("Cannot request screen coordinates in physical pixels");
                  try {
                      var bounds = VisibleWindowBounds(hwnd);
                      using (var bitmap = new Bitmap(bounds.Width, bounds.Height))
                      {
                          using (var graphics = Graphics.FromImage(bitmap))
                              graphics.CopyFromScreen(bounds.Left, bounds.Top, 0, 0, bounds.Size);
                          bitmap.Save(filename, ImageFormat.Png);
                      }
                  } finally {
                      SetThreadDpiAwarenessContext(previous);
                  }
              }
              public static uint CurrentDesktopHeight() {
                  var mode = new DisplayMode();
                  mode.Size = (ushort)Marshal.SizeOf(typeof(DisplayMode));
                  if (!EnumDisplaySettings(null, -1, ref mode)) throw new Exception("Cannot read desktop resolution");
                  return mode.Height;
              }
              public static int SetDesktopScale(int percent) {
                  const uint activePaths = 2;
                  uint count, modeCount;
                  CheckDisplayResult("Enumerate active display paths", GetDisplayConfigBufferSizes(activePaths, out count, out modeCount));
                  if (count != 1) throw new Exception("Expected a single active display path, got " + count);
                  // DISPLAYCONFIG_PATH_INFO begins with the source LUID and ID.
                  var paths = Marshal.AllocHGlobal(checked((int)count * 72));
                  var modes = Marshal.AllocHGlobal(checked((int)modeCount * 64));
                  try {
                      CheckDisplayResult("Read active display paths", QueryDisplayConfig(activePaths, ref count, paths, ref modeCount, modes, IntPtr.Zero));
                      var source = (Source)Marshal.PtrToStructure(paths, typeof(Source));
                      var range = new ScaleRange { Header = new DisplayRequest { Type = -3, Size = 32, Source = source } };
                      CheckDisplayResult("Read display scaling range", DisplayConfigGetDeviceInfo(ref range));
                      var values = new[] { 100, 125, 150, 175, 200, 225, 250, 300, 350, 400, 450, 500 };
                      var prior = values[range.Current - range.Minimum];
                      var position = Array.IndexOf(values, percent) + range.Minimum;
                      if (position < range.Minimum || position > range.Maximum)
                          throw new Exception("The active display does not support scale " + percent);
                      if (position != range.Current) {
                          var change = new ScaleChange {
                              Header = new DisplayRequest { Type = -4, Size = 24, Source = source }, Position = position
                          };
                          CheckDisplayResult("Set display scaling", DisplayConfigSetDeviceInfo(ref change));
                          CheckDisplayResult("Read back display scaling", DisplayConfigGetDeviceInfo(ref range));
                          if (range.Current != position) throw new Exception("Windows did not apply scale " + percent);
                      }
                      return prior;
                  } finally {
                      Marshal.FreeHGlobal(modes);
                      Marshal.FreeHGlobal(paths);
                  }
              }
              public static void PrepareDesktop() { SetDesktop(1920,1080); }
              public static void SetDesktop(uint width, uint height) {
                  var mode = new DisplayMode();
                  mode.Size = (ushort)Marshal.SizeOf(typeof(DisplayMode));
                  if (!EnumDisplaySettings(null, -1, ref mode)) throw new Exception("Cannot inspect runner display");
                  mode.Width = width; mode.Height = height; mode.Fields = 0x180000;
                  int result = ChangeDisplaySettings(ref mode, 0);
                  if (result != 0) throw new Exception("Cannot resize audit desktop: " + result);
              }
              public static void CaptureDesktop(string filename) {
                  var bounds = System.Windows.Forms.Screen.PrimaryScreen.Bounds;
                  using (var bitmap = new Bitmap(bounds.Width, bounds.Height)) {
                      using (var graphics = Graphics.FromImage(bitmap))
                          graphics.CopyFromScreen(bounds.Left, bounds.Top, 0, 0, bounds.Size);
                      bitmap.Save(filename, ImageFormat.Png);
                  }
              }
              public static void MovePointerAway() { SetCursorPos(5, 5); }
              public static void RightClick(int x, int y) {
                  if (!SetCursorPos(x, y)) throw new Exception("Could not move to the profile row");
                  mouse_event(8, 0, 0, 0, UIntPtr.Zero);
                  mouse_event(16, 0, 0, 0, UIntPtr.Zero);
              }
              public static int Capture(IntPtr hwnd, string filename) {
                  Rect r;
                  if (!GetWindowRect(hwnd, out r)) throw new Exception("GetWindowRect failed");
                  bool sidebar = filename.IndexOf("-sidebar", StringComparison.OrdinalIgnoreCase) >= 0;
                  int captureLeft = sidebar ? Math.Max(0, r.Left) : r.Left;
                  int w = r.Right - captureLeft, h = r.Bottom - r.Top;
                  if (w < 300 || h < 250 || w > 6000 || h > 4000)
                      throw new Exception("Implausible application window dimensions: " + w + "x" + h);
                  using (var bitmap = new Bitmap(w, h, PixelFormat.Format32bppArgb)) {
                      using (var g = Graphics.FromImage(bitmap)) {
                          g.Clear(Color.Black);
                          bool popup = filename.IndexOf("visual-", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("picker", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("add-device", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("about-dialog", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("profile-rename", StringComparison.OrdinalIgnoreCase) >= 0 ||
                              filename.IndexOf("-menu", StringComparison.OrdinalIgnoreCase) >= 0;
                          if (popup || sidebar) {
                              g.CopyFromScreen(captureLeft, r.Top, 0, 0, new Size(w, h));
                          } else {
                              IntPtr dc = g.GetHdc();
                              try {
                                  if (!PrintWindow(hwnd, dc, 2) && !PrintWindow(hwnd, dc, 0))
                                      throw new Exception("PrintWindow could not render UCR");
                              } finally { g.ReleaseHdc(dc); }
                          }
                      }
                      var colors = new HashSet<int>();
                      for (int y = 8; y < h - 8; y += Math.Max(1, h / 35))
                          for (int x = 8; x < w - 8; x += Math.Max(1, w / 35))
                              colors.Add(bitmap.GetPixel(x,y).ToArgb());
                      if (colors.Count < 12)
                          throw new Exception("Screenshot blank or unrendered (" + colors.Count + " sampled colors)");
                      bitmap.Save(filename, ImageFormat.Png);
                      return colors.Count;
                  }
              }
          }
