              [System.Windows.Forms.SendKeys]::SendWait(' ')
              (Find-UcrElement $nameProperty 'Buttons').GetCurrentPattern(
                  [System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              (Find-UcrElement $nameProperty 'Reconnected A').SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              [System.IO.File]::WriteAllText($mode, 'reconnected')
              Write-Host 'Verified offline reassignment, live menu precedence and the refreshed cache after a second disconnect.'
              $fourWay = Find-UcrElement $nameProperty '4-Way output'
              $fourWay.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
              Invoke-UcrControl 'UiMappingCompoundOutputBind'
              $left = Find-UcrElement $nameProperty 'Left stick (Primary output)'
              Find-UcrElement $nameProperty 'D-pad (Primary output)' | Out-Null
              Find-UcrElement $nameProperty 'Right stick (Secondary output)' | Out-Null
              Find-UcrElement $nameProperty 'D-pad 1 (Secondary output)' | Out-Null
              $dpad = Find-UcrElement $nameProperty 'D-pad 2 (Secondary output)'
              $menu = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($left)
              $right = $menu.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new($nameProperty,'Right stick (Primary output)'))
              if ($null -ne $right) { throw 'The two trigger axes were offered as a right stick.' }
              $frame = [UcrWindowCapture]::VisibleWindowBounds($handle)
              foreach ($item in @($left,$dpad)) {
                  $bounds = $item.Current.BoundingRectangle
                  if ($bounds.Left -lt $frame.Left -or $bounds.Top -lt $frame.Top -or
                      $bounds.Right -gt $frame.Right -or $bounds.Bottom -gt $frame.Bottom) {
                      throw "Four-way output choice '$($item.Current.Name)' is outside the application window: $bounds, window $frame."
                  }
              }
              [UcrWindowCapture]::MovePointerAway()
              Start-Sleep -Milliseconds 600
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-visual-compound-output-picker.png')) | Out-Null
              Write-Host 'Verified the multi-device four-way menu fits inside the UCR window.'
              $dpad.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 350
              Save-UcrIfNeeded
              $four = Read-NewMapping
              $channels = @($four.plugins | ForEach-Object { $_.data.outputs })
              $keys = ($channels | ForEach-Object { [int]$_.keyValue }) -join ','
              if ($four.outputRepresentation -ne 1 -or -not $four.compoundDigitalOutput -or
                  $channels.Count -ne 4 -or $keys -ne '7,5,4,6' -or
                  @($channels | Where-Object { -not $_.isBound -or $_.deviceConfigurationGuid -ne $secondaryOutputId -or
                      $_.compoundPresetName -ne 'D-pad 2' }).Count) {
                  throw 'The secondary output D-pad did not persist the four ordered destinations on the chosen device.'
              }
              Write-Host 'Verified both labelled devices, excluded the primary device triggers as a right stick, and saved only the four directions of the secondary device second D-pad.'

              Set-UcrText 'WorkspaceMappingSearch' ''
              [UcrWindowCapture]::MoveWindow($handle,30,30,1600,900,$true) | Out-Null
              Start-Sleep -Milliseconds 500
              $paired = Find-UcrProfileRow 'Block paired audit'
              $paired.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Invoke-UcrControl 'UiProfileAddOutputDevice'
              Find-UcrElement $nameProperty 'Audit standby controller' | Out-Null
              Invoke-UcrControl 'UiCancel'
              Start-Sleep -Milliseconds 350
              [System.IO.File]::WriteAllText($mode, 'disconnected')
              Invoke-UcrControl 'UiProfileAddOutputDevice'
              Find-UcrElement $nameProperty 'Audit standby controller' | Out-Null
              $cachedChoice = @(Get-UcrControls 'UiAddDeviceChoice' | Where-Object { $_.Current.Name -eq 'Audit standby controller' })
              if ($cachedChoice.Count -ne 1) { throw 'The offline controller did not have one selectable checkbox.' }
              $cachedChoice[0].GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle()
              Find-UcrElement $nameProperty ('UcrAuditOutput ' + [char]0x00B7 + ' Disconnected') | Out-Null
              [UcrWindowCapture]::MovePointerAway()
              [UcrWindowCapture]::Capture($handle,(Join-Path $directory 'UCR-visual-add-offline-output.png')) | Out-Null
              Invoke-UcrControl 'UiConfirmAddDevices'
              Start-Sleep -Milliseconds 500
              Save-UcrIfNeeded
              $savedState = Get-Content -Raw -Encoding UTF8 -LiteralPath (Join-Path $dataRoot 'state.json') | ConvertFrom-Json
              $pairedProfile = @($savedState.profiles | Where-Object { $_.guid -eq $auditProfiles[1].guid })[0]
              $added = @($pairedProfile.outputDeviceConfigurations | Where-Object { $_.device.deviceHandle -eq 'audit-standby' })
              if ($added.Count -ne 1) { throw 'The profile did not save the disconnected controller.' }
              [System.IO.File]::WriteAllText($mode, 'reconnected')
              Invoke-UcrControl 'UiProfileAddOutputDevice'
              $existing = @(Get-UcrControls 'UiAddDeviceChoice' | Where-Object { $_.Current.Name -eq 'Audit standby controller' })
              if ($existing.Count -ne 0) { throw 'The add-output list offered a duplicate after the controller reconnected.' }
              Invoke-UcrControl 'UiCancel'
              Write-Host 'Verified a newly remembered disconnected controller can be added, saved, and deduplicated when reconnecting.'

              Write-Host 'Verified keyboard menus, automatic output device selection, picker bounds, three categories, Escape focus and persisted LT assignment.'

              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(10000)) { throw 'The audit process did not exit.' }
              $originalScale = $null
              $dpiResults = @()
              try {
                  foreach ($percent in @(125,150,200)) {
                      $result = [ordered]@{ scale = $percent; expectedDpi = (96 * $percent / 100); actualDpi = $null; status = 'Not run' }
                      try {
                          try {
                              $priorScale = [UcrWindowCapture]::SetDesktopScale($percent)
                          }
                          catch {
                              if ($percent -ne 200) { throw }
                              $applied = $false
                              $displayErrors = @($_.Exception.Message)
                              foreach ($resolution in @('2560x1440','3840x2160','2560x1600','2048x1536')) {
                                  $width, $height = $resolution -split 'x'
                                  try {
                                      [UcrWindowCapture]::SetDesktop([uint32]$width,[uint32]$height)
                                      $priorScale = [UcrWindowCapture]::SetDesktopScale($percent)
                                      $applied = $true
                                      Write-Host "Enabled 200 percent scale at $resolution."
                                      break
                                  }
                                  catch { $displayErrors += "$resolution $($_.Exception.Message)" }
                              }
                              if (-not $applied) { throw ($displayErrors -join ' | ') }
                          }
                          if ($null -eq $originalScale) { $originalScale = $priorScale }
                          Start-Sleep -Milliseconds 700
                          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
                          $handle = [IntPtr]::Zero
                          for ($attempt = 0; $attempt -lt 50; $attempt++) {
                              Start-Sleep -Milliseconds 400
                              $process.Refresh()
                              if ($process.HasExited) { throw 'UCR exited while starting under display scaling.' }
                              if ($process.MainWindowHandle -ne [IntPtr]::Zero -and
                                  $process.MainWindowTitle -match 'Universal Control Remapper' -and
                                  $process.MainWindowTitle -notmatch 'Starting|Splash') {
                                  $handle = $process.MainWindowHandle
                                  break
                              }
                          }
                          if ($handle -eq [IntPtr]::Zero) { throw 'UCR main window was unavailable.' }
                          Start-Sleep -Milliseconds 650
                          $result.actualDpi = [UcrWindowCapture]::GetDpiForWindow($handle)
                          if ($result.actualDpi -ne $result.expectedDpi) {
                              throw "UCR has window DPI $($result.actualDpi), expected $($result.expectedDpi)."
                          }
                          $processCondition = [System.Windows.Automation.PropertyCondition]::new(
                              [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
                          $root = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
                          $profileRow = Find-UcrProfileRow 'Block single audit'
                          $profileRow.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
                          Set-UcrText 'WorkspaceMappingSearch' 'Keyboard single mapping'
                          if (@(Get-UcrControls 'BindButton' | Where-Object { -not $_.Current.IsOffscreen }).Count -eq 0) {
                              Invoke-UcrControl 'UiExpandMapping'
                          }
                          Start-Sleep -Milliseconds 250
                          $caption = (Find-UcrControl 'UiBindingBlockCaption').Current.BoundingRectangle
                          $blockSwitch = (Find-UcrControl 'UiBindingBlockSwitch').Current.BoundingRectangle
                          if ($caption.Bottom -gt $blockSwitch.Top + 2 -or
                              $caption.Left -ge $blockSwitch.Right -or $caption.Right -le $blockSwitch.Left) {
                              throw "The Block label is not above its switch at $percent percent: $caption, $blockSwitch."
                          }
                          Write-Host "Verified Block label above its switch at $percent percent."
                          $viewer = Find-UcrControl 'MappingSectionsScrollViewer'
                          $pattern = $null
                          if ($viewer.TryGetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern,[ref]$pattern) -and
                              $pattern.Current.VerticallyScrollable) {
                              $pattern.SetScrollPercent(-1,100)
                          }
                          Start-Sleep -Milliseconds 300
                          $output = @(Get-UcrControls 'BindButton' | Where-Object { -not $_.Current.IsOffscreen } |
                              Sort-Object -Property { $_.Current.BoundingRectangle.Y }, { $_.Current.BoundingRectangle.X })[-1]
                          $output.SetFocus()
                          [System.Windows.Forms.SendKeys]::SendWait(' ')
                          $frame = [UcrWindowCapture]::VisibleWindowBounds($handle)
                          foreach ($name in @('Buttons','Directions','Axes','Audit D')) {
                              $tile = Find-UcrElement $nameProperty $name
                              $bounds = $tile.Current.BoundingRectangle
                              if ($bounds.Left -lt $frame.Left -or $bounds.Right -gt $frame.Right -or
                                  $bounds.Top -lt 0 -or $bounds.Bottom -gt [UcrWindowCapture]::CurrentDesktopHeight()) {
                                  throw "Picker control '$name' is clipped at $percent percent: $bounds, window $frame."
                              }
                          }
                          [UcrWindowCapture]::MovePointerAway()
                          [UcrWindowCapture]::CapturePhysicalWindow($handle,(Join-Path $directory "UCR-visual-dpi-$percent.png")) | Out-Null
                          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
                          Start-Sleep -Milliseconds 250
                          if (-not $output.Current.HasKeyboardFocus) { throw "Picker did not return keyboard focus at $percent percent." }
                          $result.status = 'Passed'
                          Write-Host "Verified output picker at $percent percent Windows scaling. Actual UCR window DPI: $($result.actualDpi)."
                      }
                      catch {
                          $result.status = $_.Exception.Message
                          Write-Host "Display-scaling verification at $percent percent: $($result.status)"
                          if ($handle -ne [IntPtr]::Zero) {
                              try { [UcrWindowCapture]::CapturePhysicalWindow($handle,(Join-Path $directory "UCR-visual-dpi-failure-$percent.png")) | Out-Null } catch {}
                          }
                      }
                      finally {
                          if ($null -ne $process -and -not $process.HasExited) {
                              Stop-Process -Id $process.Id -Force
                              $process.WaitForExit(10000) | Out-Null
                          }
                          $dpiResults += [pscustomobject]$result
                      }
                  }
              }
              finally {
                  if ($null -ne $originalScale) { [UcrWindowCapture]::SetDesktopScale($originalScale) | Out-Null }
                  [UcrWindowCapture]::PrepareDesktop()
                  $dpiResults | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'display-scaling-results.json')
              }
              Copy-Item -LiteralPath $dataRoot -Destination (Join-Path $directory 'valid-data-before-startup-error') -Recurse
              Remove-Item -LiteralPath $dataRoot -Recurse -Force
              New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
              $badState = Join-Path $dataRoot 'state.json'
              '{invalid-json' | Set-Content -LiteralPath $badState -Encoding UTF8 -NoNewline
              $originalHash = (Get-FileHash -LiteralPath $badState -Algorithm SHA256).Hash
              $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
              $errorCondition = [System.Windows.Automation.AndCondition]::new(
                  [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$process.Id),
                  [System.Windows.Automation.PropertyCondition]::new($nameProperty,'UCR could not start'))
              $errorWindow = $null
              for ($attempt = 0; $attempt -lt 45 -and $null -eq $errorWindow; $attempt++) {
                  Start-Sleep -Milliseconds 500
                  $process.Refresh()
                  if ($process.HasExited) { throw 'Invalid saved data still terminated UCR before an actionable error appeared.' }
                  $errorWindow = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,$errorCondition)
              }
              if ($null -eq $errorWindow) { throw 'No startup data error dialog appeared.' }
              $messages = @($errorWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name }) -join ' '
              if ($messages -notlike '*state.json*' -or $messages -notlike '*without replacing your saved profiles*') { throw 'The startup error omitted the failing file or recovery guidance.' }
              [UcrWindowCapture]::CaptureDesktop((Join-Path $directory 'UCR-visual-startup-data-error.png'))
              $okCondition = [System.Windows.Automation.PropertyCondition]::new($nameProperty,'OK')
              $ok = $errorWindow.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$okCondition)
              $ok.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              if (-not $process.WaitForExit(10000) -or $process.ExitCode -ne 1) { throw 'Startup failure did not exit cleanly with code 1.' }
              if ((Get-FileHash -LiteralPath $badState -Algorithm SHA256).Hash -ne $originalHash) { throw 'Startup failure rewrote the invalid data file.' }
              Write-Host 'Verified invalid saved data shows the file path and recovery guidance, remains unchanged and exits cleanly.'


          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath (Join-Path $directory 'capture-error.txt')
              try { [UcrWindowCapture]::Capture($handle, (Join-Path $directory 'UCR-visual-audit-failure.png')) | Out-Null } catch {}
              Write-Error $_
              throw
          }
          finally {
              if ($null -ne $process) {
                  try { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } } catch {}
              }
          }

      - name: Upload UCR visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UCR-Visual-Audit
          path: ${{ runner.temp }}/UCR-Visual-Audit/
          if-no-files-found: warn

