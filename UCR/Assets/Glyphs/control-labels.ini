# UCR keyboard glyph labels — editable without recompiling.
# Format: Keyboard.<binding name>=<short text inside key outline>
# Restart UCR after changes. Missing entries use built-in labels.
Keyboard.Comma=,
Keyboard.Period=.
Keyboard.Semicolon=;
Keyboard.Application=MENU
Keyboard.Backspace=BKSP
Keyboard.Caps Lock=CAPS
